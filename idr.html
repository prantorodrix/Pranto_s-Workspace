<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<title>Pranto's Workspace</title>
<link rel="icon" type="image/png" href="index.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Bootstrap & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
/* =========================================
   PREMIUM VARIABLES & THEMES
   ========================================= */
:root {
--font-head: 'Outfit', sans-serif; --font-body: 'Inter', sans-serif; --font-num: 'Space Grotesk', monospace;
--primary: #4f46e5; --primary-rgb: 79, 70, 229; --secondary: #0ea5e9; --accent: #e11d48; --success: #059669; --warning: #d97706;
--glass-bg: rgba(255, 255, 255, 0.75); --glass-border: 1px solid rgba(255, 255, 255, 0.9); --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.05); --card-radius: 24px;
--text-main: #0f172a; --text-sub: #475569; --input-bg: rgba(255,255,255,0.85); --bg-color: #f0f4f8;
--header-bg-start: #3b82f6; --header-bg-end: #1d4ed8; --header-text: #ffffff;
--match-bg: #dcfce7; --match-text: #166534; --mismatch-bg: #fee2e2; --mismatch-text: #991b1b;
}
[data-bs-theme="dark"] {
--primary: #6366f1; --glass-bg: rgba(20, 27, 45, 0.7); --glass-border: 1px solid rgba(255, 255, 255, 0.07); --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
--text-main: #f8fafc; --text-sub: #94a3b8; --input-bg: rgba(15, 23, 42, 0.7); --bg-color: #060b14;
--header-bg-start: #1e3a8a; --header-bg-end: #0f172a;
--match-bg: rgba(34,197,94,0.2); --match-text: #4ade80; --mismatch-bg: rgba(239,68,68,0.2); --mismatch-text: #f87171;
}
body { font-family: var(--font-body); color: var(--text-main); min-height: 100vh; background-color: var(--bg-color); transition: background-color 0.5s ease, color 0.5s ease; overflow: hidden; margin: 0; padding: 0; display: flex; flex-direction: column; }

/* Curved Backgrounds */
.curved-header-bg { position: fixed; top: 0; left: 0; width: 100%; height: 600px; background: linear-gradient(135deg, var(--header-bg-start), var(--header-bg-end)); z-index: -2; overflow: hidden; }
.curved-header-bg::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 250px; background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg"><path fill="%23f0f4f8" fill-opacity="1" d="M0,160L80,149.3C160,139,320,117,480,128C640,139,800,181,960,186.7C1120,192,1280,155,1360,133.3L1440,112L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320C320,320,160,320,80,320L0,320Z"></path></svg>'); background-size: cover; background-position: center bottom; transition: background-image 0.5s ease; }
[data-bs-theme="dark"] .curved-header-bg::after { background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg"><path fill="%23060b14" fill-opacity="1" d="M0,160L80,149.3C160,139,320,117,480,128C640,139,800,181,960,186.7C1120,192,1280,155,1360,133.3L1440,112L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320C320,320,160,320,80,320L0,320Z"></path></svg>'); }
.curved-bottom-wrap { position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; z-index: -2; pointer-events: none; }
.curved-bottom-wrap svg { display: block; width: 100%; height: 100%; object-fit: cover; }

/* Canvas (Optional bg decor) */
#bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

.font-head { font-family: var(--font-head); } .font-num { font-family: var(--font-num); letter-spacing: -0.5px; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; } .no-scrollbar::-webkit-scrollbar { display: none; }
.copyable { cursor: pointer; } .section-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; margin-bottom: 5px; display: block; font-weight: 800; color: var(--primary); }

.glass-panel { background: var(--glass-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: var(--glass-border); box-shadow: var(--glass-shadow); border-radius: var(--card-radius); border-bottom: 4px solid rgba(var(--primary-rgb), 0.15); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, border-bottom-color 0.3s ease; }
.glass-panel:hover { box-shadow: 0 10px 25px rgba(0,0,0,0.08); transform: translateY(-2px); border-bottom-color: var(--primary); }
[data-bs-theme="dark"] .glass-panel { border-bottom-color: rgba(255,255,255,0.05); } [data-bs-theme="dark"] .glass-panel:hover { box-shadow: 0 10px 25px rgba(0,0,0,0.4); border-bottom-color: var(--primary); }

.form-control, .form-select { background: var(--input-bg); border: 1px solid rgba(0,0,0,0.05); border-bottom: 2px solid rgba(0,0,0,0.1); border-radius: 12px; color: var(--text-main); font-family: var(--font-num); font-size: 0.85rem; transition: 0.3s; padding: 10px; font-weight: 600; }
[data-bs-theme="dark"] .form-control, [data-bs-theme="dark"] .form-select { border-color: rgba(255,255,255,0.05); border-bottom-color: rgba(0,0,0,0.3); }
.form-control:focus, .form-select:focus { background: var(--glass-bg); border-color: rgba(var(--primary-rgb), 0.5) !important; box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.15); color: var(--text-main); }
.form-control:not(:placeholder-shown):not([readonly]) { background-color: rgba(16, 185, 129, 0.08) !important; border-bottom-color: #10b981 !important; }

.btn-premium { background: linear-gradient(135deg, var(--primary), #818cf8); color: white !important; border: none; border-radius: 12px; padding: 10px 24px; font-weight: 700; transition: 0.3s; box-shadow: 0 4px 15px rgba(var(--primary-rgb), 0.3); border-bottom: 3px solid #3730a3; }
.btn-premium:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(var(--primary-rgb), 0.5); filter: brightness(1.1); border-bottom-width: 1px; margin-bottom: 2px; }
.btn-premium:active { transform: translateY(1px); border-bottom-width: 0; margin-bottom: 3px; }

/* Navbar */
#nav-container { position: fixed; top: 0; left: 0; width: 100%; z-index: 1050; background: var(--glass-bg); backdrop-filter: blur(30px); border-bottom: var(--glass-border); box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 12px 20px; transition: background-color 0.5s ease; }
.nav-pill { width: 100%; max-width: 1600px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
.nav-brand { font-family: var(--font-head); font-size: 1.6rem; display: flex; align-items: center; gap: 8px; text-decoration: none; letter-spacing: -0.5px; }
.logo-icon { background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.8rem; }
.logo-text { color: var(--text-main); font-weight: 800; transition: 0.3s; }
.logo-highlight { color: var(--primary); font-weight: 400; margin-left: 2px; transition: 0.3s; }

.nav-links { display: flex; gap: 28px; align-items: center; }
.nav-item { text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.85rem; transition: 0.3s; position: relative; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; }
.nav-item:hover, .nav-item.active { color: var(--primary); opacity: 1; }

.theme-tog { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(var(--primary-rgb), 0.1); color: var(--primary); display: flex; align-items: center; justify-content: center; transition: 0.3s; font-size: 1.1rem; margin-left: 15px; }
.theme-tog:hover { background: var(--primary); color: #fff; transform: rotate(15deg) scale(1.1); }

/* Layout Grid */
#main-wrapper { display: flex; width: 100%; max-width: 1600px; margin: 90px auto 0; padding: 0 20px; height: calc(100vh - 100px); gap: 20px; }
#sidebar { width: 340px; flex-shrink: 0; height: 100%; overflow-y: auto; padding: 1.5rem; transition: width 0.3s; }
#sidebar.collapsed { width: 0; padding: 0; overflow: hidden; border: none; opacity: 0; }
#content-area { flex-grow: 1; overflow-y: auto; padding: 0.5rem 1rem 3rem 1rem; display: flex; flex-direction: column; gap: 20px; }
#resizer { width: 6px; cursor: col-resize; z-index: 100; border-radius: 10px; transition: 0.2s; } 
#resizer:hover { background: rgba(var(--primary-rgb), 0.3); }

#eob-display-bar { position: sticky; top: -5px; z-index: 1020; background: var(--input-bg); border: var(--glass-border); border-bottom: 3px solid rgba(var(--primary-rgb), 0.2); backdrop-filter: blur(20px); border-radius: 16px; padding: 12px 20px; margin-bottom: 10px; display: none; align-items: center; gap: 15px; flex-wrap: wrap; box-shadow: 0 4px 15px rgba(0,0,0,0.05); animation: slideDown 0.3s ease-out; }
#eob-display-bar.visible { display: flex; } @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.idr-card { background: var(--input-bg); border: 1px solid rgba(0,0,0,0.05); border-bottom: 3px solid rgba(0,0,0,0.1); border-radius: 16px; padding: 15px; margin-bottom: 15px; position: relative; overflow: hidden; transition: 0.3s; }
[data-bs-theme="dark"] .idr-card { border-color: rgba(255,255,255,0.05); border-bottom-color: rgba(0,0,0,0.3); }
.idr-card:hover { transform: translateY(-2px); border-bottom-color: var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
.idr-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; font-weight: 600; color: var(--text-sub); }
.idr-val { font-weight: 700; text-align: right; color: var(--text-main); font-family: var(--font-num); }

.bg-match { background: var(--match-bg); color: var(--match-text); border-radius: 6px; padding: 2px 8px; }
.bg-mismatch { background: var(--mismatch-bg); color: var(--mismatch-text); border-radius: 6px; padding: 2px 8px; }

.eob-table-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed rgba(128,128,128,0.2); font-size: 0.85rem; font-family: var(--font-num); font-weight: 600; }
.eob-table-row:last-child { border-bottom: none; } .eob-table-row span:last-child { font-weight: 800; }

@keyframes blinkCopy { 0% { background-color: rgba(16, 185, 129, 0.4); border-color: #10b981; } 100% { background-color: var(--input-bg); border-color: var(--primary); } }
.blink-active { animation: blinkCopy 0.4s ease-out; }
.loader { width: 16px; height: 16px; border: 2px solid currentColor; border-bottom-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Note Box customization to match Standard UI */
#note_Text { border: 1px solid rgba(0,0,0,0.05); border-left: 4px solid var(--primary); border-bottom: 3px solid rgba(0,0,0,0.1); background: var(--input-bg); font-family: var(--font-body); font-weight: 600; font-size: 0.9rem; line-height: 1.5; transition: all 0.3s; }
[data-bs-theme="dark"] #note_Text { border-color: rgba(255,255,255,0.05); border-left-color: var(--primary); border-bottom-color: rgba(0,0,0,0.4); }
#note_Text:focus { box-shadow: 0 4px 15px rgba(var(--primary-rgb), 0.1); }
</style>
</head>
<body>
<!-- Curved Background SVG -->
<div class="curved-header-bg"></div>
<canvas id="bg-canvas"></canvas> <!-- Subtle particles -->

<!-- NAVIGATION BAR -->
<div id="nav-container" style="animation-delay: 0s">
    <div class="nav-pill">
        <a href="#" class="nav-brand">
            <i class="bi bi-hexagon-fill logo-icon"></i>
            <span class="logo-text">Pranto's<span class="logo-highlight">Workspace</span></span>
        </a>
        <div class="nav-links d-none d-lg-flex align-items-center">
            <a href="index.html" class="nav-item">Home</a>
            <a href="#" class="nav-item active"><i class="bi bi-airplane-engines me-1"></i> Determination</a>
            <button id="toggle-sidebar" class="btn btn-sm btn-link text-muted ms-2"><i class="bi bi-layout-sidebar-inset"></i></button>
        </div>
        <div class="d-flex align-items-center">
            <button id="processBtn" class="btn btn-premium btn-sm py-2 px-3 ms-2"><i class="bi bi-lightning-charge-fill me-1"></i> Extract</button>
            <button id="clearBtn" class="btn btn-outline-danger btn-sm py-2 px-3 ms-2 fw-bold shadow-sm" style="border-radius:10px;"><i class="bi bi-trash3-fill me-1"></i> Clear</button>
            <button id="themeToggle" class="theme-tog"><i class="bi bi-moon-stars-fill"></i></button>
        </div>
    </div>
</div>

<div id="main-wrapper">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="glass-panel custom-scroll">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-3 border-bottom border-secondary border-opacity-25">
            <span class="font-head fw-bolder text-primary fs-5"><i class="bi bi-list-check me-2"></i>IDR Results</span>
            <span class="badge bg-primary bg-opacity-10 text-primary fs-6 font-num" id="res-count">0</span>

    </aside>
    
    <div id="resizer"></div>

    <!-- MAIN CONTENT -->
    <main id="content-area" class="custom-scroll">
        <div id="eob-display-bar">
            <div id="eob-content" class="d-flex gap-4 align-items-center w-100 text-nowrap font-num fw-bold fs-6"></div>
        </div>
        
        <div class="row g-4">
            <!-- Formats Input -->
            <div class="col-lg-7 order-lg-2">
                <div class="glass-panel p-4 h-100">
                    <div class="row g-3 h-100">
                        <div class="col-4 border-end border-secondary border-opacity-25 pe-3 d-flex flex-column gap-2">
                            <span class="section-label text-success"><i class="bi bi-file-earmark-spreadsheet me-1"></i> 2024-25 Format</span>
                            <textarea id="idrTextInput1" class="form-control no-scrollbar flex-grow-1" rows="1" placeholder="Paste Row 1"></textarea>
                            <textarea id="idrTextInput2" class="form-control no-scrollbar flex-grow-1" rows="1" placeholder="Paste Row 2"></textarea>
                            <textarea id="idrTextInput3" class="form-control no-scrollbar flex-grow-1" rows="1" placeholder="Paste Row 3"></textarea>
                            <textarea id="idrTextInput4" class="form-control no-scrollbar flex-grow-1" rows="1" placeholder="Paste Row 4"></textarea>
                        </div>
                        <div class="col-4 border-end border-secondary border-opacity-25 px-3 d-flex flex-column gap-2">
                            <span class="section-label text-warning"><i class="bi bi-file-earmark-spreadsheet me-1"></i> 2022-23 Format</span>
                            <textarea id="idr2022TextInput1" class="form-control no-scrollbar flex-grow-1" rows="1" placeholder="Paste Row 1"></textarea>
                            <textarea id="idr2022TextInput2" class="form-control no-scrollbar flex-grow-1" rows="1" placeholder="Paste Row 2"></textarea>
                            <textarea id="idr2022TextInput3" class="form-control no-scrollbar flex-grow-1" rows="1" placeholder="Paste Row 3"></textarea>
                            <textarea id="idr2022TextInput4" class="form-control no-scrollbar flex-grow-1" rows="1" placeholder="Paste Row 4"></textarea>
                        </div>
                        <div class="col-4 ps-3 d-flex flex-column gap-2">
                            <span class="section-label text-info"><i class="bi bi-stars me-1"></i> 2026 Format</span>
                            <textarea id="idr2026TextInput1" class="form-control no-scrollbar flex-grow-1" rows="1" placeholder="Paste Row 1"></textarea>
                            <textarea id="idr2026TextInput2" class="form-control no-scrollbar flex-grow-1" rows="1" placeholder="Paste Row 2"></textarea>
                            <textarea id="idr2026TextInput3" class="form-control no-scrollbar flex-grow-1" rows="1" placeholder="Paste Row 3"></textarea>
                            <textarea id="idr2026TextInput4" class="form-control no-scrollbar flex-grow-1" rows="1" placeholder="Paste Row 4"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- EOB Input -->
            <div class="col-lg-2 order-lg-1">
                <div class="glass-panel p-3 h-100 d-flex flex-column">
                    <span class="section-label text-primary mb-2"><i class="bi bi-file-medical me-1"></i> Updated EOB</span>
                    <input type="text" id="manualTicketInput" class="form-control mb-3 text-primary text-center fs-6" placeholder="Manual Tkt No">
                    <textarea id="eobUpdatedInput" class="form-control no-scrollbar flex-grow-1" placeholder="Paste Full EOB Text here..."></textarea>
                </div>
            </div>

            <!-- EOB Breakdown -->
            <div class="col-lg-3 order-lg-3">
                <div class="glass-panel p-4 h-100 d-flex flex-column">
                    <span class="section-label text-secondary mb-3"><i class="bi bi-pie-chart-fill me-1"></i> EOB Breakdown</span>
                    <div id="eob-details-grid" class="flex-grow-1 d-flex flex-column justify-content-center">
                        <div class="text-center text-muted small opacity-50 font-num fw-bold">Waiting for extraction...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Correspondence Section -->
        <div class="glass-panel p-4">
            <h6 class="font-head fw-bold mb-4 fs-5 d-flex align-items-center text-primary border-bottom border-primary border-opacity-25 pb-3">
                <i class="bi bi-pencil-square me-2"></i> Correspondence Note
            </h6>
            <div class="row g-4">
                <div class="col-md-9 d-flex flex-column">
                    <textarea id="note_Text" class="form-control copyable no-scrollbar flex-grow-1 p-3" rows="8" readonly onclick="copyToClipboard(this)" placeholder="Generated note will appear here..."></textarea>
                    <div class="d-flex justify-content-end mt-2"><small class="text-muted fw-bold font-num"><i class="bi bi-hand-index-thumb me-1"></i> Click to copy</small></div>
                </div>
                <div class="col-md-3 d-flex flex-column gap-3">
                    <button id="genNoteBtn" class="btn btn-premium w-100 py-3"><i class="bi bi-stars me-2"></i>Generate Note</button>
                    <div class="p-3 bg-secondary bg-opacity-10 rounded-4 border border-secondary border-opacity-25 flex-grow-1">
                        <span class="section-label mb-2">User Info</span>

                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Bottom Curve SVG -->
<div class="curved-bottom-wrap">
<svg viewBox="0 0 1440 100" preserveAspectRatio="none">
    <path fill="#0f172a" d="M0,32L48,37.3C96,43,192,53,288,58.7C384,64,480,64,576,58.7C672,53,768,43,864,42.7C960,43,1056,53,1152,53.3C1248,53,1344,43,1392,37.3L1440,32L1440,100L1392,100C1344,100,1248,100,1152,100C1056,100,960,100,864,100C768,100,672,100,576,100C480,100,384,100,288,100C192,100,96,100,48,100L0,100Z"></path>
</svg>
</div>

<!-- Background Animation (Particles preserved) -->
<script>(function(){const canvas=document.getElementById('bg-canvas'),x=canvas.getContext('2d');let w,h,p=[];const rs=()=>{w=canvas.width=innerWidth;h=canvas.height=innerHeight;};window.onresize=rs;rs();for(let i=0;i<35;i++)p.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,s:Math.random()*2});const anim=()=>{x.clearRect(0,0,w,h);x.fillStyle=getComputedStyle(document.body).getPropertyValue('--primary');p.forEach(d=>{d.x+=d.vx;d.y+=d.vy;if(d.x<0)d.x=w;if(d.x>w)d.x=0;if(d.y<0)d.y=h;if(d.y>h)d.y=0;x.globalAlpha=0.08;x.beginPath();x.arc(d.x,d.y,d.s,0,6.28);x.fill();});requestAnimationFrame(anim);};anim();})();</script>   
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Core Application Logic (100% Intact) -->
<script>
    document.addEventListener('DOMContentLoaded', () => { 
        initTheme(); 
        initSidebar(); 
        initPersistent(); 
        const savedTheme = localStorage.getItem('theme') || 'light'; document.documentElement.setAttribute('data-bs-theme', savedTheme);
        document.getElementById('themeToggle').innerHTML = savedTheme === 'dark' ? '<i class="bi bi-sun-fill"></i>' : '<i class="bi bi-moon-stars-fill"></i>';
    });
    
    const els = {
        process: document.getElementById('processBtn'), clear: document.getElementById('clearBtn'), eobIn: document.getElementById('eobUpdatedInput'), manualTkt: document.getElementById('manualTicketInput'),
        results: document.getElementById('idr-results-container'), eobBar: document.getElementById('eob-display-bar'), eobContent: document.getElementById('eob-content'),
        eobGrid: document.getElementById('eob-details-grid'), resCount: document.getElementById('res-count'), errorDiv: document.getElementById('sidebar-errors'),
        idr24: [1,2,3,4].map(i => document.getElementById(`idrTextInput${i}`)), idr22: [1,2,3,4].map(i => document.getElementById(`idr2022TextInput${i}`)), idr26: [1,2,3,4].map(i => document.getElementById(`idr2026TextInput${i}`))
    };
    let globalData = { eob: null, idrRows: [] };

    els.manualTkt.addEventListener('input', () => { 
        const manVal = els.manualTkt.value.trim();
        const currentTkt = manVal.toUpperCase() || (globalData.eob ? globalData.eob.tkt.toUpperCase() : null);
        
        const eobDisp = document.querySelector('.eob-ticket-disp');
        if (eobDisp) { eobDisp.innerText = manVal || (globalData.eob ? globalData.eob.tkt : 'N/A'); } 
        else if (!globalData.eob && manVal) { renderEOB(); }

        if (globalData.idrRows.length > 0) {
            document.querySelectorAll('.idr-card').forEach((card, i) => {
                const r = globalData.idrRows[i];
                const tktEl = card.querySelector('.ticket-val');
                if (tktEl) {
                    tktEl.classList.remove('bg-match', 'bg-mismatch');
                    if (currentTkt && r.ticket.toUpperCase() !== currentTkt) { tktEl.classList.add('bg-mismatch'); } 
                    else { tktEl.classList.add('bg-match'); }
                }
            });
        }
    });

    const fmtMoney = (n) => isNaN(n) ? '$0.00' : '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    const parseMoney = (s) => parseFloat((s||'').replace(/[$,\s]/g, '')) || 0;
    const getDate = () => {
        const tz = document.getElementById('note_Shift').value === 'Night' ? 'America/New_York' : 'Asia/Dhaka';
        try { return new Date().toLocaleDateString('en-US', { timeZone: tz, year: '2-digit', month: '2-digit', day: '2-digit' }); } 
        catch (e) { const d = new Date(); return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${String(d.getFullYear()).slice(-2)}`; }
    };

    function parseEOB(txt) {
        if(!txt) return null;
        const getVal = (reg) => { const match = txt.match(reg); return match ? parseMoney(txt.substring(match.index + match[0].length).split(/[\r\n]+/)[0].trim()) : 0; };
        const billed = getVal(/(Total Bill|Billed Amount)\s*:?/i), paid = getVal(/(^|[\r\n])(Plan Payment|Total Payment|Plan Paid|Paid Amount|Total Paid)\s*:?/i);
        const coins = getVal(/(Coinsurance Amount|Coinsurance)\s*:?/i), copay = getVal(/(Copay Amount|Copay)\s*:?/i), deduc = getVal(/(Deductible Amount|Deductible)\s*:?/i);
        const addl = getVal(/(Insurance Current Paid Amount|Additional Paid)\s*:?/i);
        let ptResp = coins + copay + deduc; if(ptResp === 0) ptResp = getVal(/(Copay\/Deductible Amount|Responsibility)\s*:?/i);
        const tktMatch = txt.match(/(Patient Account Number|Pt Acct No)\s*:?[\s\r\n]+([^\r\n]+)/i);
        const tkt = tktMatch ? tktMatch[2].trim() : 'N/A';
        const clm = (txt.match(/(Claim I?D|Claim No|Claim Number|Control Number)\s*:?[\s\r\n]+([^\r\n]+)/i) || [])[2]?.trim() || 'N/A';
        return { tkt, clm, prov: (txt.match(/(Billing Provider Name|Provider Name)\s*:?[\s\r\n]+([^\r\n]+)/i) || [])[2]?.trim() || '', billed, paid, ptResp, addl, coins, copay, deduc };
    }

    function parseIDR() {
        const allInputs = [...els.idr24.map(e=>({v:e.value, m:'24'})), ...els.idr22.map(e=>({v:e.value, m:'22'})), ...els.idr26.map(e=>({v:e.value, m:'26'}))];
        const maps = { '24':{t:2,i:1,c:3,cpt:4,wl:17,add:18,pd:19,m:8}, '22':{t:1,i:5,c:2,cpt:3,wl:19,add:20,pd:21,m:8}, '26':{t:3,i:1,c:4,cpt:5,wl:20,add:21,pd:22,m:10} };
        const rows = [];
        allInputs.forEach((o, idx) => {
            if(!o.v.trim()) return;
            const cols = o.v.split(/\t/); const map = maps[o.m]; const g = (i) => cols[i]?.trim() || '--';
            const pmtDateVal = g(map.pd); const status = (pmtDateVal !== '--' && pmtDateVal !== '') ? 'Received' : 'Waiting';
            let rawWl = g(map.wl).toLowerCase(), finalWl = '';
            if(rawWl.includes('win') || rawWl === 'w') finalWl = 'WIN'; else if(rawWl.includes('lose') || rawWl === 'l') finalWl = 'LOSE'; else if(rawWl.includes('close') || rawWl === 'c') finalWl = 'CLOSED';
            
            let idrType = '';
            if(o.m === '26') {
                const matchType = o.v.match(/(Single-Batch|Single Batch|Single|Batch|Bundle)/i);
                if(matchType) { idrType = matchType[1].replace(' ', '-'); idrType = idrType.charAt(0).toUpperCase() + idrType.slice(1).toLowerCase(); if(idrType.toLowerCase()==='single-batch') idrType='Single-Batch'; }
            }
            rows.push({ idx: idx, type: o.m === '26' ? '2026' : (o.m==='24'?'2024':'2022'), idrType: idrType, ticket: g(map.t), idr: g(map.i), claim: g(map.c), cpt: g(map.cpt), wl: finalWl, addl: g(map.add), addlStatus: status, mediator: g(map.m) });
        });
        return rows;
    }

    els.process.addEventListener('click', () => {
        const btn = els.process; const old = btn.innerHTML; btn.innerHTML = `<span class="loader"></span> Extracting...`;
        setTimeout(() => { setError(null); globalData.eob = parseEOB(els.eobIn.value); globalData.idrRows = parseIDR(); renderEOB(); renderSidebar(); btn.innerHTML = old; }, 300);
    });

    function renderEOB() {
        const manTkt = els.manualTkt.value.trim();
        if(!globalData.eob && !manTkt) { els.eobBar.classList.remove('visible'); els.eobGrid.innerHTML = `<div class="text-center text-muted small opacity-50 font-num fw-bold">Waiting for extraction...</div>`; return; }
        
        const e = globalData.eob || { tkt: manTkt, clm: 'N/A', billed: 0, paid: 0, ptResp: 0, addl: 0, prov: 'N/A' };
        const sep = `<span class="opacity-25 mx-2">|</span>`;
        const dispTkt = manTkt || e.tkt; 
        
        els.eobContent.innerHTML = `<span class="text-primary eob-ticket-disp">${dispTkt}</span>${sep}<span>${e.clm}</span>${sep}<span class="text-warning">Bill: ${fmtMoney(e.billed)}</span>${sep}<span class="text-success">Paid: ${fmtMoney(e.paid)}</span>${sep}<span class="text-danger">PT: ${fmtMoney(e.ptResp)}</span>${sep}<span id="bar-addl" class="text-primary fw-bolder">Addl: ${fmtMoney(e.addl)}</span><span class="ms-auto small fw-normal opacity-50 text-truncate" style="max-width:150px">${e.prov}</span>`;
        els.eobBar.classList.add('visible');
        els.eobGrid.innerHTML = `<div class="eob-table-row"><span>Billed</span> <span>${fmtMoney(e.billed)}</span></div><div class="eob-table-row"><span>Paid</span> <span>${fmtMoney(e.paid)}</span></div><div class="eob-table-row text-primary mb-2"><span>Addl</span> <span>${fmtMoney(e.addl)}</span></div><div class="eob-table-row border-top border-secondary border-opacity-25 pt-2 text-warning"><span>Adj w/ PT</span> <span>${fmtMoney(e.billed - e.paid - e.ptResp)}</span></div><div class="eob-table-row text-danger"><span>Adj w/o PT</span> <span>${fmtMoney(e.billed - e.paid)}</span></div>`;
    }

    function renderSidebar() {
        els.results.innerHTML = ''; els.resCount.innerText = globalData.idrRows.length;
        const eobTkt = els.manualTkt.value.trim().toUpperCase() || (globalData.eob ? globalData.eob.tkt.toUpperCase() : null);

        globalData.idrRows.forEach((r, i) => {
            const card = document.createElement('div'); card.className = 'idr-card shadow-sm';
            const isWin = r.wl === 'WIN', isClose = r.wl === 'CLOSED';
            const refState = isWin || isClose ? '' : 'disabled'; const refPlace = isWin ? 'Required' : (isClose ? 'Optional' : 'Disabled');
            const typeBadge = r.idrType ? `<span class="badge bg-warning text-dark me-1" style="font-size:0.65rem; border-radius: 6px;">${r.idrType}</span>` : '';
            
            let tktClass = 'bg-match';
            if(eobTkt && r.ticket.toUpperCase() !== eobTkt) { tktClass = 'bg-mismatch'; }

            let singleBatchHtml = '';
            if(r.idrType === 'Single-Batch') {
                singleBatchHtml = `
                    <div class="mt-2 p-2 bg-info bg-opacity-10 border border-info border-opacity-25 sb-container" style="border-radius: 10px;">
                        <span class="small fw-bold text-info mb-1 d-block">Single-Batch Requirements</span>
                        <input type="text" class="form-control form-control-sm mb-1 sb-cpts shadow-none" placeholder="CPTs (e.g. 96374 96361)" required>
                        <input type="text" class="form-control form-control-sm mb-1 sb-amts shadow-none" placeholder="Amounts (e.g. $452.00 $335.40)" required>
                        <select class="form-select form-select-sm sb-status shadow-none" required>
                            <option value="">Addl Status...</option><option value="Received">Received</option><option value="Waiting">Waiting</option>
                        </select>
                    </div>`;
            }

            card.innerHTML = `
                <div class="d-flex justify-content-between mb-2">
                    <span class="font-num fw-bolder text-primary small">#${r.idr}</span>
                    <div>${typeBadge}<span class="badge bg-secondary bg-opacity-25 text-secondary" style="font-size:0.65rem; border-radius: 6px;">${r.type}</span></div>
                </div>
                <div class="idr-row"><span>Ticket</span> <span class="idr-val ticket-val ${tktClass}">${r.ticket}</span></div>
                <div class="idr-row"><span>Claim</span> <span class="idr-val">${r.claim}</span></div>
                <div class="idr-row"><span>Addl</span> <span class="idr-val fw-bold idr-val-addl" id="idr-addl-${i}" data-addl="${parseMoney(r.addl)}">${r.addl}</span></div>
                <div class="idr-row"><span>Date Status</span> <span class="idr-val ${r.addlStatus==='Received'?'text-success':'text-warning'}">${r.addlStatus}</span></div>
                ${singleBatchHtml}
                <div class="mt-3 pt-3 border-top border-secondary border-opacity-10">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <span class="small fw-bold opacity-75">Status</span><input class="form-control py-1 w-50 text-end wl-in shadow-none" style="font-size:0.8rem;" value="${r.wl}" placeholder="W/L/C" data-i="${i}" oninput="handleWL(this)">
                    </div>
                    <div class="d-flex align-items-center justify-content-between">
                        <span class="small fw-bold opacity-75">Refund</span><input class="form-control py-1 w-50 text-end ref-in shadow-none" style="font-size:0.8rem;" placeholder="${refPlace}" ${refState} data-i="${i}" onfocus="this.select()" oninput="handleRefund(this)">
                    </div>
                </div>`;
            els.results.appendChild(card);
        });
        
        if(globalData.eob && globalData.idrRows.length > 0) {
            const eobAddl = globalData.eob.addl, totalIdrAddl = globalData.idrRows.reduce((a,b)=>a+parseMoney(b.addl),0);
            const bar = document.getElementById('bar-addl');
            if(Math.abs(totalIdrAddl - eobAddl) < 0.05 && totalIdrAddl !== 0) {
                bar.classList.replace('text-primary', 'text-success'); document.querySelectorAll('.idr-val-addl').forEach(el => el.classList.add('bg-match'));
            } else {
                bar.classList.replace('text-primary', 'text-danger');
                globalData.idrRows.forEach((r, i) => {
                    const el = document.getElementById(`idr-addl-${i}`);
                    if(Math.abs(parseMoney(r.addl) - eobAddl) < 0.05 && eobAddl !== 0) el.classList.add('bg-match'); else el.classList.add('bg-mismatch');
                });
            }
        }
    }

    window.handleWL = (el) => {
        let v = el.value.toLowerCase(); if(v==='w') el.value='WIN'; else if(v==='l') el.value='LOSE'; else if(v==='c') el.value='CLOSED';
        const newVal = el.value.toLowerCase(), ref = el.closest('.idr-card').querySelector('.ref-in');
        if(newVal.includes('win')) { ref.disabled = false; ref.placeholder = "Required"; ref.classList.remove('is-invalid'); } 
        else if(newVal.includes('close')) { ref.disabled = false; ref.placeholder = "Optional"; ref.classList.remove('is-invalid'); } 
        else if(newVal.includes('lose')) { ref.disabled = true; ref.value = ''; ref.placeholder = "Disabled"; ref.classList.remove('is-invalid'); } 
        else { ref.disabled = true; ref.value = ''; ref.placeholder = "Disabled"; }
    };
    window.handleRefund = (el) => { const v = el.value.toLowerCase(); if(v==='r') el.value='Received'; if(v==='w') el.value='Waiting'; if(el.value) el.classList.remove('is-invalid'); };
    function typeWriter(element, text, i = 0) { if(i===0) element.value=''; if(i<text.length){ element.value+=text.charAt(i); setTimeout(()=>typeWriter(element,text,i+1),3); } }

    window.copyToClipboard = (el) => { 
        el.select(); 
        document.execCommand('copy'); 
        el.classList.remove('blink-active');
        void el.offsetWidth;
        el.classList.add('blink-active');
    };

    document.getElementById('genNoteBtn').addEventListener('click', () => {
        const noteBox = document.getElementById('note_Text');
        const nameEl = document.getElementById('note_Name'); 
        if(!nameEl.value.trim()) { nameEl.classList.add('is-invalid'); return; } nameEl.classList.remove('is-invalid');
        
        let errors = [];
        let allTkts = [];
        const rows = [];
        
        if(!globalData.eob && !els.manualTkt.value.trim()) {
            errors.push("⚠️ EOB DETAILS OR TICKET MISSING: PLEASE EXTRACT EOB DATA OR ENTER MANUAL TICKET NUMBER FIRST.");
        } else {
            const eobTkt = els.manualTkt.value.trim().toUpperCase() || (globalData.eob ? globalData.eob.tkt.toUpperCase() : 'N/A');
            
            document.querySelectorAll('.idr-card').forEach((card, i) => {
                const org = globalData.idrRows[i];
                allTkts.push(org.ticket.trim().toUpperCase());
                const wl = card.querySelector('.wl-in').value.toLowerCase();
                const ref = card.querySelector('.ref-in').value.toLowerCase();
                
                if(wl.includes('win') && !ref) {
                    card.querySelector('.ref-in').classList.add('is-invalid');
                    errors.push(`⚠️ REFUND MISSING: PLEASE ENTER REFUND STATUS FOR WIN IN IDR #${org.idr}.`);
                }

                let addlRec = org.addlStatus === 'Received';
                let sbText = '';
                if(org.idrType === 'Single-Batch') {
                    const cptsIn = card.querySelector('.sb-cpts'), amtsIn = card.querySelector('.sb-amts'), stIn = card.querySelector('.sb-status');
                    if(!cptsIn.value || !amtsIn.value || !stIn.value) { 
                        cptsIn.classList.add('is-invalid'); amtsIn.classList.add('is-invalid'); stIn.classList.add('is-invalid'); 
                        errors.push(`⚠️ SINGLE-BATCH REQUIRED FIELDS MISSING FOR IDR #${org.idr}.`);
                    } else {
                        cptsIn.classList.remove('is-invalid'); amtsIn.classList.remove('is-invalid'); stIn.classList.remove('is-invalid');
                        const cArr = cptsIn.value.trim().split(/\s+/), aArr = amtsIn.value.trim().split(/\s+/);
                        let tAmt = 0; sbText = "ADDITIONAL AMOUNTS OF ";
                        for(let j=0; j<Math.min(cArr.length, aArr.length); j++) { sbText += `${aArr[j]} FOR CPT ${cArr[j]}; `; tAmt += parseMoney(aArr[j]); }
                        sbText += `TOTAL ADDITIONAL AMOUNT (${fmtMoney(tAmt)}). `;
                        addlRec = (stIn.value === 'Received');
                    }
                }
                rows.push({ wl: wl, ref: ref, addl: org.addl, addlRec: addlRec, idr: org.idr, cpt: org.cpt, med: org.mediator, isSb: org.idrType === 'Single-Batch', sbText: sbText });
            });

            const uniqueTkts = [...new Set(allTkts)];
            if(uniqueTkts.length > 1) {
                errors.push("⚠️ TICKET MISMATCH: MULTIPLE DIFFERENT TICKET NUMBERS FOUND IN IDR ROWS.");
            } else if(uniqueTkts.length === 1 && uniqueTkts[0] !== eobTkt) {
                errors.push(`⚠️ TICKET MISMATCH: EOB TICKET (${eobTkt}) DOES NOT MATCH IDR TICKET (${uniqueTkts[0]}).`);
                document.querySelectorAll('.ticket-val').forEach(el => {
                    el.classList.remove('bg-match'); 
                    el.classList.add('bg-mismatch');
                });
            }
        }

        if(errors.length > 0) {
            noteBox.style.color = '#ef4444'; noteBox.style.borderColor = '#ef4444';
            typeWriter(noteBox, "ERROR ALERTS:\n\n" + errors.join('\n\n'));
            return;
        }

        noteBox.style.color = ''; noteBox.style.borderColor = 'var(--primary)';

        let init = document.getElementById('note_Initial').value.trim();
        let allDone = true;
        rows.forEach(r => {
            const isWin = r.wl.includes('win'), isClose = r.wl.includes('close'), isLose = r.wl.includes('lose');
            if(isClose) { if(r.ref.startsWith('w')) allDone = false; } 
            else if(isWin) { if(!r.addlRec || !r.ref.startsWith('r')) allDone = false; } 
            else if(isLose) { if(!r.addlRec) allDone = false; } 
            else allDone = false;
        });

        if(!init) {
            if(allDone) init = "FINAL REVIEW";
            else if(rows.length === 1) {
                if(rows[0].wl.includes('win')) init = "IDR WIN";
                else if(rows[0].wl.includes('lose')) init = "IDR LOSE";
                else init = "IDR FOLLOW UP";
            } else init = "IDR FOLLOW UP";
        }

        const e = globalData.eob || { clm:rows[0]?.idr||'N/A', billed:0, paid:0, ptResp:0 };
        let txt = `${getDate()}>${init}>${nameEl.value.toUpperCase()}>WORKING ON TRACKING SHEET. CLAIM: ${e.clm}; TOTAL BILL ${fmtMoney(e.billed)}, INS PAID ${fmtMoney(e.paid)}, PT RESPONSIBILITY ${fmtMoney(e.ptResp)}. NEGOTIATION AND IDR DONE. `;
        
        rows.forEach(r => {
            const wlUp = r.wl.toUpperCase();
            if(r.wl.includes('close')) {
                txt += `${r.idr}: STATUS IS CLOSED. `;
                if(r.ref.startsWith('r')) txt += "WE RECEIVED FEE REFUND. "; else if(r.ref.startsWith('w')) txt += "WE ARE WAITING FOR FEE REFUND. ";
            } else {
                let statusTxt = r.wl.includes('win') ? "WIN" : (r.wl.includes('lose') ? "LOSE" : wlUp);
                if(r.isSb) { txt += `${r.idr}: IDR SUBMITTED TO MEDIATOR ${r.med}. STATUS IS ${statusTxt}. ${r.sbText}`; } 
                else { txt += `${r.idr}: IDR SUBMITTED ON CPT ${r.cpt} TO MEDIATOR ${r.med}. STATUS IS ${statusTxt} WITH ADDITIONAL ${r.addl}. `; }
                
                const isWin = r.wl.includes('win'), hasFee = r.ref.startsWith('r'), waitFee = r.ref.startsWith('w');
                if(isWin) {
                    if(r.addlRec && hasFee) txt += "WE RECEIVED ADDITIONAL PAYMENT AND MEDIATION FEE REFUND. ";
                    else if(!r.addlRec && hasFee) txt += "WE ARE WAITING FOR ADDITIONAL PAYMENT BUT WE RECEIVED MEDIATION FEE REFUND. ";
                    else if(r.addlRec && waitFee) txt += "WE RECEIVED ADDITIONAL PAYMENT BUT WAITING FOR MEDIATION FEE REFUND. ";
                    else txt += "WE ARE WAITING FOR ADDITIONAL PAYMENT AND MEDIATION FEE REFUND. ";
                } else {
                    txt += r.addlRec ? "WE RECEIVED ADDITIONAL PAYMENT. " : "WE ARE WAITING FOR ADDITIONAL PAYMENT. ";
                }
            }
        });
        txt += init === "FINAL REVIEW" ? "NO FURTHER ACTION NEEDED. BALANCE TO BE ADJUSTED." : "WAITING TO COMPLETE THE IDR PROCESS BEFORE ADJUSTMENT.";
        typeWriter(noteBox, txt.toUpperCase());
    });

    function setError(msg) { const el = els.errorDiv; if(msg) { el.innerText = msg; el.classList.remove('d-none'); } else el.classList.add('d-none'); }
    function initTheme() { 
        document.getElementById('themeToggle').addEventListener('click', function() { 
            const n = document.documentElement.getAttribute('data-bs-theme')==='dark'?'light':'dark'; 
            document.documentElement.setAttribute('data-bs-theme', n); 
            localStorage.setItem('theme', n); 
            this.innerHTML = n === 'dark' ? '<i class="bi bi-sun-fill"></i>' : '<i class="bi bi-moon-stars-fill"></i>';
        }); 
    }
    function initSidebar() {
        const sb = document.getElementById('sidebar'); document.getElementById('toggle-sidebar').addEventListener('click', () => sb.classList.toggle('collapsed'));
        let x=0, w=0, md=false; document.getElementById('resizer').onmousedown = e => { md=true; x=e.clientX; w=sb.offsetWidth; document.body.style.cursor='col-resize'; };
        document.onmousemove = e => { if(md) sb.style.width = (w + e.clientX - x) + 'px'; }; document.onmouseup = () => { md=false; document.body.style.cursor=''; };
    }
    function initPersistent() {
        ['note_Name','note_Initial', 'note_Shift'].forEach(id => { const e=document.getElementById(id); if(e) { e.value = localStorage.getItem(id) || (id === 'note_Shift' ? 'Day' : ''); e.addEventListener(e.tagName === 'SELECT' ? 'change' : 'input', () => localStorage.setItem(id, e.value)); } });
        els.clear.addEventListener('click', () => { document.querySelectorAll('textarea').forEach(t=>t.value=''); document.querySelectorAll('input:not([id*="note_Name"]):not([id*="note_Initial"])').forEach(i=>i.value=''); els.eobBar.classList.remove('visible'); els.results.innerHTML=''; els.eobGrid.innerHTML = `<div class="text-center text-muted small opacity-50 font-num fw-bold">Waiting for extraction...</div>`; globalData={eob:null, idrRows:[]}; setError(null); document.getElementById('note_Text').style.borderColor = ''; document.getElementById('note_Text').style.color = '';});
    }
</script>
