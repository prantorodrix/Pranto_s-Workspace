<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pranto's Note Tool</title>
<link rel="icon" type="image/png" href="note.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
/* --- CORE VARIABLES --- */
:root {
 --f:'Outfit',sans-serif; --mono:'Rajdhani',monospace;
 
 /* Stunning Animated Gradient Background Variables */
 --bg-color-1: #e0c3fc;
 --bg-color-2: #8ec5fc;
 --bg-color-3: #e0c3fc;
 
 /* Glassmorphism Properties */
 --glass-bg: rgba(255, 255, 255, 0.4);
 --glass-border: 1px solid rgba(255, 255, 255, 0.5);
 --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
 --blur: 16px;
 
 --card-bg: rgba(255, 255, 255, 0.45);
 --nav-bg: rgba(255, 255, 255, 0.6);
 --input-bg: rgba(255, 255, 255, 0.6);
 --pri:#4f46e5; --sec:#ec4899; --txt:#1e293b; --txt-l:#475569;
 --adj-bg: rgba(241, 245, 249, 0.6); --adj-txt: #334155;
 
 /* Watch Vars */
 --w-bg: rgba(255, 255, 255, 0.6); --w-txt: #1e293b; --w-acc: #4f46e5;
}

[data-bs-theme="dark"] {
 --bg-color-1: #0f172a;
 --bg-color-2: #1e1b4b;
 --bg-color-3: #312e81;
 
 --glass-bg: rgba(15, 23, 42, 0.5); 
 --glass-border: 1px solid rgba(255, 255, 255, 0.1);
 --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
 
 --card-bg: rgba(30, 41, 59, 0.5);
 --nav-bg: rgba(15, 23, 42, 0.6);
 --input-bg: rgba(0, 0, 0, 0.3);
 --pri:#818cf8; --sec:#f472b6; --txt:#f8fafc; --txt-l:#cbd5e1;
 --adj-bg: rgba(255,255,255,0.05); --adj-txt: #e2e8f0;
 
 /* Watch Vars Dark */
 --w-bg: rgba(15, 23, 42, 0.6); --w-txt: #f8fafc; --w-acc: #818cf8;
}

body {
    font-family: var(--f); 
    background: linear-gradient(-45deg, var(--bg-color-1), var(--bg-color-2), var(--bg-color-3), var(--bg-color-2));
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: var(--txt);
    transition: background 0.3s ease;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* RED BLINKING ANIMATION FOR REQUIRED DATE */
@keyframes blinkRed {
    0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.6); border-color: #dc3545; }
    50% { box-shadow: 0 0 0 6px rgba(220, 53, 69, 0); border-color: #dc3545; }
    100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); border-color: #dc3545; }
}
.blink-red { 
    animation: blinkRed 1.5s infinite !important; 
    border-color: #dc3545 !important; 
    background-color: rgba(220, 53, 69, 0.1) !important;
}

/* --- NAVBAR --- */
#nav {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    width: 95%; max-width: 1250px; height: 65px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1.5rem; z-index: 1100;
    background: var(--nav-bg); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
    border: var(--glass-border); border-radius: 50px;
    box-shadow: var(--glass-shadow);
}
.brand { font-size: 1.3rem; font-weight: 800; background: linear-gradient(90deg, var(--pri), var(--sec)); -webkit-background-clip: text; color: transparent; white-space: nowrap; }
.menu { display: flex; gap: 1.5rem; align-items: center; }
.n-lnk { text-decoration: none; color: var(--txt); font-weight: 600; font-size: 0.95rem; opacity: 0.8; transition: .3s; position: relative; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
.n-lnk:hover, .n-lnk.active { opacity: 1; color: var(--pri); }
.n-lnk.active::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 100%; height: 2px; background: var(--pri); border-radius: 2px; }

.n-rt { display: flex; align-items: center; gap: 10px; }
.btn-nav-act { border: none; padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 0.8rem; color: white; transition: .2s; display: flex; align-items: center; gap: 5px; cursor: pointer; }
.btn-ext { background: linear-gradient(135deg, var(--pri), #8b5cf6); }
.btn-clr { background: linear-gradient(135deg, #ef4444, #f43f5e); }
.btn-nav-act:hover { transform: translateY(-2px); filter: brightness(115%); box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
.t-btn { width: 34px; height: 34px; border-radius: 50%; border: var(--glass-border); background: var(--glass-bg); color: var(--txt); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: .3s; }
.t-btn:hover { background: var(--pri); color: #fff; transform: rotate(20deg); }
.p-pic { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid transparent; background: linear-gradient(var(--nav-bg), var(--nav-bg)) padding-box, linear-gradient(45deg, var(--pri), var(--sec)) border-box; cursor: pointer; }

/* LAYOUT */
#wrap { display: flex; margin-top: 100px; height: calc(100vh - 100px); }
#sb { width: 270px; background: var(--glass-bg); border-right: var(--glass-border); border-top: var(--glass-border); border-bottom: var(--glass-border); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); display: flex; flex-direction: column; margin-left: 20px; border-radius: 20px 0 0 20px; margin-bottom: 20px; box-shadow: var(--glass-shadow); height: calc(100vh - 120px); z-index: 10; }
#sb-c { flex: 1; overflow-y: auto; padding: 1rem; height: 100%; }
#main { flex: 1; padding: 0 2rem 2rem 1.5rem; overflow-y: auto; display: flex; flex-direction: column; z-index: 5; }

/* COMPONENTS */
.card { background: var(--card-bg); border: var(--glass-border); border-radius: 16px; box-shadow: var(--glass-shadow); margin-bottom: 1rem; backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); }
.form-control, .form-select { background: var(--input-bg); border: 1px solid rgba(0,0,0,0.08); border-radius: 10px; font-size: 0.9rem; color: var(--txt); transition: .2s; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-weight: 500;}
.form-control::placeholder { color: var(--txt-l); opacity: 0.6; }
[data-bs-theme="dark"] .form-control, [data-bs-theme="dark"] .form-select { border-color: rgba(255,255,255,0.1); color: var(--txt); }
.form-control:focus, .form-select:focus { box-shadow: 0 0 0 2px var(--pri); outline: 0; border-color: transparent; background: var(--card-bg); }
.form-control.is-invalid { border-color: #dc3545 !important; box-shadow: 0 0 0 2px rgba(220, 53, 69, 0.25) !important; }
textarea.form-control { resize: none; overflow: hidden; }

/* Click to Copy Style */
textarea[readonly], input[readonly] { cursor: pointer; background: rgba(0,0,0,0.02); }
[data-bs-theme="dark"] textarea[readonly], [data-bs-theme="dark"] input[readonly] { background: rgba(255,255,255,0.02); }
textarea[readonly]:active, input[readonly]:active { transform: scale(0.99); }

.btn-neu { display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 6px 20px; border: var(--glass-border); font-weight: 700; font-size: 13px; background: var(--glass-bg); box-shadow: var(--glass-shadow); color: var(--pri); transition: .2s; cursor: pointer; backdrop-filter: blur(10px); }
.btn-neu:hover { transform: translateY(-2px); background: var(--nav-bg); box-shadow: 0 8px 20px rgba(79, 70, 229, 0.2); }
.nav-tabs-glass { border: none; padding: 0 .5rem; display: flex; gap: 10px; }
.nav-tabs-glass .nav-link { border: none; background: transparent; color: var(--txt); font-weight: 700; border-radius: 10px; padding: 8px 15px; font-size: .85rem; opacity: .6; transition: .3s; }
.nav-tabs-glass .nav-link.active { color: var(--pri); opacity: 1; background: var(--card-bg); box-shadow: var(--glass-shadow); }

/* IDR ITEMS */
.idr-item { display: flex; justify-content: space-between; font-size: .8rem; padding: 5px 0; border-bottom: 1px dashed rgba(0,0,0,0.08); }
[data-bs-theme="dark"] .idr-item { border-bottom-color: rgba(255,255,255,0.08); }
.idr-val { font-weight: 700; text-align: right; color: var(--pri); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bg-match { background: rgba(16,185,129,.15); color: #059669; padding: 0 6px; border-radius: 4px; }
.bg-mismatch { background: rgba(239,68,68,.15); color: #dc2626; padding: 0 6px; border-radius: 4px; }
.bg-overpaid { background: rgba(245,158,11,.15); color: #d97706; padding: 0 6px; border-radius: 4px; }

/* EOB BAR */
#eob-bar { display: none; padding: .8rem 1.2rem; margin-bottom: 1rem; background: var(--card-bg); box-shadow: var(--glass-shadow); border-radius: 12px; font-weight: 600; white-space: nowrap; overflow-x: auto; color: var(--pri); border: var(--glass-border); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); }
#eob-bar.visible { display: flex; gap: 20px; align-items: center; }
.ed-inp { padding: 4px 8px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.1); background: var(--input-bg); width: 80px; font-size: .8rem; color: var(--txt); font-weight: 600; }
.wl-inp { width: 100px; font-weight: 700; text-align: right; }
#cAdj { background-color: var(--adj-bg) !important; color: var(--adj-txt) !important; border: var(--glass-border) !important; }

/* EXTRA SUMMARY BOX */
.summary-box { background: var(--glass-bg); border: var(--glass-border); border-radius: 12px; padding: 12px; height: 100%; display: flex; flex-direction: column; justify-content: center; backdrop-filter: blur(10px);}
.sum-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(0,0,0,0.1); padding: 5px 0; font-size: 0.85rem;}
[data-bs-theme="dark"] .sum-item { border-bottom-color: rgba(255,255,255,0.1); }
.sum-item:last-child { border-bottom: none; }
.sum-lbl { font-weight: 600; opacity: 0.7; }
.sum-val { font-weight: 800; color: var(--pri); text-align: right; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}

/* WATCH WIDGET */
#smart-watch {
    position: fixed; bottom: 20px; left: 20px; z-index: 1000;
    width: 130px; height: auto;
    background: var(--w-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    border: var(--glass-border); border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15), inset 0 0 0 1px rgba(255,255,255,0.2);
    padding: 12px; display: flex; flex-direction: column; align-items: center;
    font-family: var(--mono); color: var(--w-txt);
    transition: .3s;
}
#smart-watch:hover { transform: translateY(-5px); box-shadow: 0 15px 50px rgba(79, 70, 229, 0.3); }
.w-main { display: flex; align-items: flex-end; gap: 4px; margin-bottom: 2px; }
.w-time { font-size: 1.8rem; font-weight: 700; line-height: 1; letter-spacing: 1px; }
.w-sec-box { height: 20px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
.w-sec {margin-right:12px; font-size: 1rem; font-weight: 600; color: var(--w-acc); line-height: 20px; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.w-date { font-size: 0.7rem; font-weight: 600; opacity: 0.7; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px; }
.w-bar-bg { width: 100%; height: 4px; background: rgba(0,0,0,0.1); border-radius: 2px; overflow: hidden; position: relative; }
.w-bar-fill { height: 100%; background: linear-gradient(90deg, var(--pri), var(--sec)); width: 0%; border-radius: 2px; transition: width 0.2s linear; box-shadow: 0 0 10px var(--pri); }
[data-bs-theme="dark"] .w-bar-bg { background: rgba(255,255,255,0.2); }

/* FOOTER */
footer { background: var(--nav-bg); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); border-top: var(--glass-border); padding: 3rem 0 1.5rem; margin-top: auto; border-radius: 20px 20px 0 0; }
.f-brand { font-size: 1.3rem; font-weight: 800; color: var(--txt); margin-bottom: 1rem; display: block; }
.f-lnk { display: block; color: var(--txt-l); text-decoration: none; font-size: .85rem; margin-bottom: .6rem; transition: .2s; font-weight: 500;}
.f-lnk:hover { color: var(--pri); transform: translateX(3px); }
.s-ico { width: 32px; height: 32px; border-radius: 50%; background: var(--glass-bg); border: var(--glass-border); color: var(--pri); display: inline-flex; align-items: center; justify-content: center; margin-right: 8px; transition: .2s; }
.s-ico:hover { background: var(--pri); color: white; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(79, 70, 229, 0.3);}
</style>
</head>
<body>

<nav id="nav">
    <div class="brand">Pranto's Workspace</div>
    <div class="menu d-none d-lg-flex">
        <a href="index.html" class="n-lnk active"><i class="bi bi-house-door me-1"></i> Home</a>

    <div class="n-rt">

        <div style="width:1px; height:20px; background:var(--txt); opacity:0.2; margin:0 5px;"></div>
        <button id="theme-toggle" class="t-btn"><i id="theme-icon" class="bi bi-sun-fill"></i></button>
        <div class="dropdown">
            <img src="https://ui-avatars.com/api/?name=Pranto+Rodrix&background=4f46e5&color=fff&bold=true" class="p-pic" data-bs-toggle="dropdown">

            </ul>
        </div>
    </div>
</nav>

<div id="wrap">
    <div id="sb">
        <div class="p-4 border-bottom"><h6 class="m-0 fw-bold text-primary small"><i class="bi bi-list-columns-reverse me-2"></i>IDR Results</h6></div>
        <div id="sb-c"><div class="text-center text-muted small mt-5 fw-medium">Paste IDR data & Extract</div></div>
    </div>

    <div id="main">
        <div id="eob-bar"></div>
        <div class="row g-3 mb-4">
            <!-- EOB Box -->
            <div class="col-lg-4">
                <div class="card h-100 p-3 d-flex flex-column">
                    <label class="small fw-bold text-primary mb-2">Updated EOB</label>
                    <textarea class="form-control flex-grow-1" id="eobUp" placeholder="Paste Updated EOB here..."></textarea>
                </div>
            </div>
            
            <!-- Consolidating IDR Reports into 2 boxes -->
            <div class="col-lg-5">
                <div class="card p-3 h-100">
                    <label class="small fw-bold text-primary mb-2">IDR Reports</label>
                    <div class="row g-2 h-100">
                        <div class="col-12 h-50 pb-1">
                            <textarea class="form-control h-100" id="idr1" placeholder="Paste 2024+ Tracker Data"></textarea>
                        </div>

                            <textarea class="form-control h-100" id="idr2" placeholder="Paste 22-23 Tracker Data"></textarea>

            </div>

                     <label class="small fw-bold text-primary mb-2"><i class="bi bi-clipboard-data"></i> Extracted For Email</label>
                     <div class="summary-box" id="ext-summary">
                         <div class="text-muted small text-center fw-medium">Extract data to view summary</div>
                     </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="p-3 pb-0">
                <ul class="nav nav-tabs-glass" id="mT">

                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#t-upd">IDR Update</button></li>
                </ul>
            </div>
            <div class="card-body p-4"><div class="tab-content">

                    <div class="col-md-1"><label class="small fw-bold">Init</label><input type="text" class="form-control in-inp" id="mIni" placeholder="Init"></div>
                    <div class="col-md-2"><label class="small fw-bold">Scenario</label><select class="form-select" id="mSc" onchange="togEm()"><option value="ins">Standard</option><option value="pt">High PT</option></select></div>

                        <div style="flex:2"><label class="small fw-bold">CC</label><input type="text" class="form-control" id="mCC" value="mislam@roundtmc.com, razo@leverngear.com" readonly></div>
                        <button class="btn-neu text-primary" onclick="genEm()" style="margin-bottom:1px; height: 38px; min-width: 110px;"><i class="bi bi-send-fill me-1"></i> Generate</button>

                </div><div class="row g-4">

                <!-- IDR UPDATE (Single Line) -->

                        <div style="width: 150px;"><label class="small fw-bold">Follow Up</label><select class="form-select" id="uFol"><option value="1">1st Follow Up</option><option value="2">2nd Follow Up</option></select></div>
                        <div style="flex:1"><label class="small fw-bold">Subject</label><input type="text" class="form-control" id="uSub" readonly></div>
                        <button class="btn-neu text-primary" onclick="genUpd()" style="margin-bottom:1px; height: 38px; min-width: 110px;"><i class="bi bi-send-fill me-1"></i> Generate</button>

<script>
let gD={e:null,i:[], manTic:null};
const MED_EMAILS = {"MET":"IDR@met-hcs.com","NATIONAL":"idre@nmrusa.com","NMR":"idre@nmrusa.com","FHAS":"IDRE@fhas.com","PROVIDER":"pri-idre@provider-resources.com","RESOURCE":"pri-idre@provider-resources.com","IMPROVE":"FederalIDRE@improve.health"};

/* CLOCK LOGIC */
function startClock() {
    const timeEl = document.getElementById('wTime');
    const secEl1 = document.getElementById('wSec1');
    const secEl2 = document.getElementById('wSec2');
    const dateEl = document.getElementById('wDate');
    const barEl = document.getElementById('wBar');
    
    let lastSec = -1;

    setInterval(() => {
        const now = new Date();
        const s = now.getSeconds();
        const sStr = String(s).padStart(2, '0');
        
        timeEl.innerText = now.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Dhaka'});
        dateEl.innerText = now.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', timeZone: 'Asia/Dhaka'}).toUpperCase(); 
        
        const pct = (s / 60) * 100;
        barEl.style.width = `${pct}%`;

        if(s !== lastSec) {
            secEl1.innerText = sStr;
            secEl1.style.transform = 'translateY(10px)';
            secEl1.style.opacity = '0';
            setTimeout(() => {
                secEl1.style.transform = 'translateY(0)';
                secEl1.style.opacity = '1';
            }, 50);
        }
        lastSec = s;
    }, 1000);
}

function procAll(){
    gD.manTic = null; // Reset manual ticket override
    gD.e=pEOB(document.getElementById('eobUp').value); 
    
    // Consolidate data from the 2 boxes
    const iData = [];
    iData.push({ data: document.getElementById('idr1').value, type: 'new' });
    iData.push({ data: document.getElementById('idr2').value, type: 'old' });
    
    gD.i=pIDR(iData); 
    dEOB(gD.e); // Update top bar EOB summary
    dIDR(gD.i); 
    
    const mDetEl = document.getElementById('mDet');
    mDetEl.classList.remove('blink-red', 'is-invalid'); // reset first

    if(gD.i.length>0){ 
        const f = gD.i[0];

            mDetEl.value=f.dt;

            // Blink red if date is missing
            mDetEl.classList.add('blink-red');
        }
        if(f.id&&f.id!='--')document.getElementById('uDis').value=f.id;
        if(f.md)document.getElementById('uMed').value=f.md;
        
        let eTic = gD.e?.tic || '--';
        let iTic = f.tk || '--';
        let isMatch = (eTic.toUpperCase() === iTic.toUpperCase()) && eTic !== '--';
        
        // Populate Summary Box 
        const c = gD.e?.clm || f.cl || '--';

            <div class="sum-item"><span class="sum-lbl">Claim:</span><span class="sum-val" title="${c}">${c}</span></div>
            <div class="sum-item"><span class="sum-lbl">Dispute:</span><span class="sum-val" title="${f.id}">${f.id}</span></div>

        `;

// Handles typing in the Manual Ticket box in the sidebar
function hTic(val){
    gD.manTic = val.trim();

        sumTic.className = `sum-val ${isMatch ? 'text-primary' : 'text-danger fw-bold'}`;
        sumTic.title = eTic;
    }
}

function pEOB(t){
    if(!t)return null; const ex=r=>{const m=t.match(r);if(!m)return'$0.00';return t.substring(m.index+m[0].length).split('\n').find(l=>l.trim()&&!l.match(/^[a-zA-Z\s\.\/()-]+:/))?.trim()||'$0.00'},pc=s=>parseFloat(s.replace(/[$,\s]/g,''))||0,gv=r=>t.match(r)?.[2].trim()||'--';
    let cn=pc(ex(/(Coinsurance Amount|Coinsurance)\s*:?/i)),dd=pc(ex(/(Deductible Amount|Deductible)\s*:?/i)),cp=pc(ex(/(Copay Amount|Copay)\s*:?/i)),pt=cn+dd+cp;if(pt===0)pt=pc(ex(/(Copay\/Deductible Amount|Responsibility)\s*:?/i));
    return{tic:gv(/(Patient Account Number|Pt Acct No)\s*:?[\s\r\n]+([^\r\n]+)/i),clm:gv(/(Claim I?D|Claim No|Claim Number)\s*:?[\s\r\n]+([^\r\n]+)/i),prv:gv(/(Billing Provider Name|Provider Name)\s*:?[\s\r\n]+([^\r\n]+)/i),bil:pc(ex(/(Total Bill|Billed Amount)\s*:?/i)),pd:pc(ex(/(^|[\r\n])(Plan Payment|Total Payment|Plan Paid|Paid Amount|Total Paid)\s*:?/i)),pt,adl:pc(ex(/(Insurance Current Paid Amount|Additional Paid)\s*:?/i)),cn,dd,cp};
}

function pIDR(inpArr){
    let r=[];
    inpArr.forEach((block)=>{
        if(!block.data.trim()) return;
        const lines = block.data.split('\n');
        
        lines.forEach(t => {
            if(!t.trim()) return;
            const c=t.split(/\t/); 
            
            if(block.type === 'new') {
                // 2024+ MAPPING
                r.push({
                    tk: c[0]?.trim() || c[2]?.trim() || '--', // Capturing Ticket Number
                    id: c[1]?.trim()||'--',
                    cl: c[3]?.trim()||'--',
                    cp: c[5]?.trim()||'--', // Fix: Updated from c[4] to c[5] for CPT
                    in: parseFloat((c[7]||'0').replace(/[$,\s]/g,'')),
                    md: c[8]?.trim()||'--',
                    dt: c[16]?.trim(),
                    wl: c[17]?.trim()||'--',
                    ad: parseFloat((c[18]||'0').replace(/[$,\s]/g,'')),
                    pm: c[19]?.trim()
                });
            } 
            else {
                // 22-23 MAPPING
                r.push({
                    tk: c[1]?.trim() || c[0]?.trim() || '--', // Capturing Ticket Number
                    id: c[5]?.trim()||'--',
                    cl: c[2]?.trim()||'--',
                    cp: c[3]?.trim()||'--',
                    in: parseFloat((c[7]||'0').replace(/[$,\s]/g,'')),
                    md: c[8]?.trim()||'--',
                    dt: c[18]?.trim(),
                    wl: c[19]?.trim()||'--',
                    ad: parseFloat((c[20]||'0').replace(/[$,\s]/g,'')),
                    pm: c[21]?.trim()
                });
            }
        });
    });
    return r;
}

function dEOB(d){

    document.getElementById('eob-bar').classList.add('visible');
}

function dIDR(d){
    const s=document.getElementById('sb-c');s.innerHTML='';

    const w=r.wl.toLowerCase(),as=(r.pm&&r.pm.length>4)?`<span class="badge bg-success ms-1">Rec</span>`:`<span class="badge bg-secondary ms-1">Wait</span>`,
    wlHtml=(r.wl==='--'||!r.wl)?`<input type="text" class="ed-inp wl-inp" placeholder="w/l/c" oninput="hWL(this,${i})">`:`<span class="idr-val fw-bold" data-wl="${w}">${r.wl}</span>`;
    
    s.innerHTML=`<div class="card sidebar-card shadow-sm border-0 bg-transparent mb-2">
        <div class="fw-bold text-primary border-bottom pb-1 mb-1 d-flex justify-content-between"><span>Result 1</span><span class="badge bg-light text-dark border">${r.id}</span></div>
        <div class="idr-item"><span>IDR Ticket</span><span class="idr-val text-truncate" title="${r.tk}">${r.tk}</span></div>
        <div class="idr-item bg-opacity-10 rounded mt-1 mb-1 p-1" style="background: rgba(0,0,0,0.03); border: 1px dashed rgba(0,0,0,0.1);">
            <span class="fw-bold">EOB Ticket</span>
            <input type="text" id="manTicInp" class="ed-inp wl-inp form-control-sm border-0 shadow-sm" style="width: 100px; padding: 2px 6px; font-size: 0.75rem;" placeholder="Missing!" oninput="hTic(this.value)">
        </div>
        <div class="idr-item"><span>Mediator</span><span class="idr-val text-truncate" title="${r.md}">${r.md}</span></div>
        <div class="idr-item"><span>Claim</span><span class="idr-val">${r.cl}</span></div>
        <div class="idr-item"><span>W/L</span>${wlHtml}</div>
        <div class="idr-item"><span>Addl</span><span class="idr-val" data-val="${r.ad}">${fmt(r.ad)}${as}</span></div>
    </div>`;
    if(!r.wl)gD.i[i].wl='';
}

const fmt=n=>'$'+(n||0).toLocaleString('en-US',{minimumFractionDigits:2});
const fDt=v=>{if(!v)return'MM/DD/YY';const[y,m,d]=v.split('-');return`${m}/${d}/${y.slice(-2)}`;}
function ani(e,t){e.value='';const w=t.split(' ');let i=0;if(e.tm)clearInterval(e.tm);e.tm=setInterval(()=>{if(i<w.length){e.value+=(i>0?' ':'')+w[i];e.scrollTop=e.scrollHeight;i++}else clearInterval(e.tm)},5);}
function hWL(i,x){let v=i.value.toLowerCase();if(v==='w')v='Win';if(v==='l')v='Lose';if(v==='c')v='Closed';i.value=v;gD.i[x].wl=v;}
function chkMed(){const v=document.getElementById('uMed').value.toUpperCase(),s=document.getElementById('uMedSugg');let f=null;for(const[k,e]of Object.entries(MED_EMAILS)){if(v.includes(k)){f=e;break}}if(f){s.querySelector('span').innerText=f;s.classList.remove('d-none')}else s.classList.add('d-none')}
function cpyMed(){navigator.clipboard.writeText(document.getElementById('uMedSugg').querySelector('span').innerText)}

function togEm(){const s=document.getElementById('mSc').value,m=document.getElementById('mMan');m.disabled=(s!=='pt');if(s!=='pt')m.value='';document.getElementById('mCC').value=(s==='pt')?'mislam@roundtmc.com, razo@leverngear.com, sufia@leverngear.com':'mislam@roundtmc.com, razo@leverngear.com';}

function genEm(){
    // VALIDATION & RED ALERT
    const v=['mNm','mIni','mTyp','mDet'];let ok=true;
    v.forEach(x=>{
        const e=document.getElementById(x);
        e.classList.remove('is-invalid');
        if(!e.value.trim()){
            e.classList.add('is-invalid');
            if(x === 'mDet') e.classList.add('blink-red'); // Emphasize missing date

    if(!ok)return;

    const d=gD,dt=fDt(document.getElementById('mDt').value),nm=document.getElementById('mNm').value,ini=document.getElementById('mIni').value,typ=document.getElementById('mTyp').value,sc=document.getElementById('mSc').value,mn=parseFloat(document.getElementById('mMan').value),det=document.getElementById('mDet').value;
    if(!d.i.length){document.getElementById('mBod').value="ERROR: No IDR Data";return}
    const i=d.i[0],e=d.e||{},clm=e.clm||i.cl||'--',eAd=(!isNaN(mn))?mn:(e.adl||0),out=Math.max(0,i.ad-eAd);
    
    // Resolve dynamic ticket

    let sub='',bod='',nt=(typ=='1')?'1ST':'2ND';
    
    // Updated Subj lines with dynamic Ticket Number (tic)
    if(sc==='pt'){
        if(isNaN(mn)){document.getElementById('mBod').value="Error: Manual Addl Req";return}
        sub=`Urgent Request for Claim Reprocessing with additionally (High PT)- Dispute Number [${i.id}] (${tic})`;
        bod=`Dear BCBS Representative,\n\nWe are emailing regarding the recently processed IDR case, ${i.id} that was finalized and paid. The newly processed EOB under claim number ${clm} shows an additional payment to the patient’s responsibility (copay, coinsurance, and/or deductible). This is in violation of the Federal Guidelines for the IDR Process. Per the Federal Guidelines, if the Mediator finds in favor of the Facility/Physician, the payment is to be made to the Facility/Physician and not to the patient’s responsibility. This newly processed EOB with the addition to the patient responsibility is in violation of the Guidelines and needs to be reprocessed with the payment to be made directly to our Facility/Physician Group.\n\nI am writing to bring your attention to the following details:\nClaim Number: ${clm}\nIDR-Determined OON Rate: ${fmt(i.in+i.ad)}\nInitial Payment: ${fmt(i.in)}\n------------------------\nTotal Outstanding Balance: ${fmt(i.ad)}\n\n(Note: In Update EOB, Additional: ${fmt(eAd)}. A total of ${fmt(out)} is less than our expected additional payment that has been added to the patient's responsibility.)\n\nThe Federal Manuals state verbatim:\n“NOTE: This determination of the OON rate does not change the participant’s, beneficiary’s, or enrollee’s cost sharing, which is based on the recognized amount, or, in the case of air ambulance services, the lower of the QPA or billed charges.”\n\nSources: Federal Independent Dispute Resolution (IDR) Process Guidance for Disputing Parties Manual March 2023, pg 27, October 2022, pg 29, April 2022, pg 27 and Federal Independent Dispute Resolution (IDR) Process Guidance for Certified IDR Entities Manual March 2023, pg 25, October 2022, pg 26, April 2022, pg 25\n\nPlease reprocess and pay this claim by the Federal Guidelines or we will have to escalate this issue to the CMS Complaint website.\n\nThank You.\n--------------------------------\n${nm}`;
        nt+=' HIGH PT EMAIL';

nRegards\n---------------\n${nm}`;
        nt+=' FOLLOW UP EMAIL';

    ani(document.getElementById('mNot'),`${dt}>IDR FOLLOW UP>${ini}>WORKING ON IDR TRACKING SHEET. NEGOTIATION AND IDR DONE. ACCORDING TO OUR RECORDS, FOR ${clm}; WE HAVE NOT RECEIVED THE ADDITIONAL PAYMENT AMOUNT OF ${fmt(i.ad)} AND THE UPDATED EOB, AS PER THE DETERMINATION OF ${i.id}, BY ${i.md.toUpperCase()} DATED ${det}. FOR BCBS ATTENTION, WE SENT ${nt} TO BCBS FOR THE IDR ADDITIONAL PAYMENT.`);

/* IDR UPDATE GENERATOR */
function genUpd(){

        el.classList.remove('is-invalid');

    const is2nd=(fol==='2'), followUpText=is2nd?"2ND":"1ST", subFollowUp=is2nd?" (2nd follow up)":"";
    let sub, bod, not;
    if(typ==='check') {sub=`Update on IDR dispute – ${dis}${subFollowUp}`;bod=`Dear ${med},\n\nI am writing to request an update status of ${dis}. It has been 60 days since we have received confirmation from CMS that ${med} is the Mediator for this dispute.\nWe have not yet received any acknowledgement from ${med} regarding this matter.\n\nWe are kindly requesting that you provide a status update at your earliest convenience.\n\nThanks!.\n--------------\n${nm}`;not=`${dt}>IDR FOLLOW UP>${ini}>${nm.toUpperCase()}>WORKING ON IDR TRACKING SHEET. NEGOTIATION AND IDR DONE. DISPUTE NUMBER ${dis}, IT HAS BEEN 60 DAYS SINCE WE HAVE RECEIVED CONFIRMATION THAT THE MEDIATOR IS SELECTED FROM CMS FOR THIS DISPUTE. WE HAVE NOT YET RECEIVED ANY ACKNOWLEDGEMENT FROM THE MEDIATOR REGARDING THIS MATTER. FOR BCBS ATTENTION, WE SENT ${followUpText} FOLLOW UP EMAIL TO BCBS FOR THE UPDATE IDR STATUS.`;} else {sub=`Request for Payment Determination ${dis}${subFollowUp}`;bod=`Dear ${med},\n\nI am writing to request the final determination for ${dis}. It\nhas been over 60 days since we submitted our offer letter and\nmediation fee. Please kindly provide a written determination at your\nearliest convenience.\n\nThanks!\n-----------------\n${nm}`;not=`${dt}>IDR FOLLOW UP>${ini}>${nm.toUpperCase()}>WORKING ON IDR TRACKING SHEET. NEGOTIATION AND IDR DONE. DISPUTE NUMBER ${dis}, IT HAS BEEN OVER 60 DAYS SINCE WE SUBMITTED OUR OFFER LETTER AND MEDIATION FEE. FOR BCBS ATTENTION, WE SENT ${followUpText} FOLLOW UP EMAIL TO BCBS FOR THE PAYMENT DETERMINATION.`;}
    document.getElementById('uSub').value=sub; ani(document.getElementById('uBod'),bod); ani(document.getElementById('uNot'),not);
}

document.querySelectorAll('input').forEach(x=>x.addEventListener('input',e=>{
    if(e.target.classList.contains('nm-inp'))localStorage.setItem('myN',e.target.value);
    if(e.target.classList.contains('in-inp'))localStorage.setItem('myI',e.target.value);
}));
</script>
