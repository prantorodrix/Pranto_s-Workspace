<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Moved</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Auto Redirect (10 seconds) - Optional -->
    <meta http-equiv="refresh" content="10;url=https://script.google.com/macros/s/AKfycbyHVVkeHWM52DYGITEU9QKjfC-6cJxHiISXdfBy1ZQMkHNxnm8THEge9DxqXFqt-26E/exec">

    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #0ea5e9;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 40px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            animation: floatUp 0.6s ease-out;
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, rgba(79,70,229,0.2), rgba(14,165,233,0.2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: var(--secondary);
            font-size: 2.5rem;
            border: 1px solid rgba(14,165,233,0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(14,165,233, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(14,165,233, 0); }
            100% { box-shadow: 0 0 0 0 rgba(14,165,233, 0); }
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 10px;
            background: linear-gradient(135deg, #818cf8, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1rem;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .highlight {
            color: #f8fafc;
            font-weight: 600;
        }

        .btn-premium {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--primary), #818cf8);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
            border-bottom: 3px solid #3730a3;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.6);
            filter: brightness(1.1);
            border-bottom-width: 1px;
            margin-bottom: 2px;
        }

        .btn-premium:active {
            transform: translateY(1px);
            border-bottom-width: 0;
            margin-bottom: 3px;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.8rem;
            color: rgba(148, 163, 184, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">
            <i class="bi bi-rocket-takeoff-fill"></i>
        </div>
        
        <h1>We Have Moved!</h1>
        
        <p>This legacy workspace has been <span class="highlight">closed and relocated</span> to a new, faster, and more secure cloud server. Please save the new page link for future access.</p>
        
        <!-- Redirect Button to Apps Script Web App -->
        <a href="https://script.google.com/macros/s/AKfycbw_h5AwpnpuzaAlNzIHQ96AwlPFSLNivtQgPJLUlLOuXjcLzfPnrJUTlBmKi3EsDb1N/exec?page=Index">
            Access New Workspace <i class="bi bi-arrow-right-circle-fill"></i>
        </a>
        
        <div class="footer-note">
            * You will be redirected automatically in 10 seconds.
        </div>
    </div>

</body>
</html>
