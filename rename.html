<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Auto Renamer | Pranto's Workspace</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b6fe0',
                        secondary: '#f4f7fe',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    boxShadow: {
                        'premium': '0 10px 40px rgba(0, 0, 0, 0.08)',
                        'inner-soft': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.02)',
                        'btn': '0 4px 14px 0 rgba(59, 111, 224, 0.39)'
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap');
        
        body {
            background-color: #f4f7fe;
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0; overflow-x: hidden;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .hero-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 380px;
            background: linear-gradient(135deg, #2563eb 0%, #3b6fe0 100%);
            border-bottom-left-radius: 50% 15%; border-bottom-right-radius: 50% 15%;
            z-index: -1;
        }

        input[type="file"] { display: none; }
        .drag-active { background-color: #eff6ff !important; border-color: #3b82f6 !important; }

        /* No Wrap Textarea for Multiple Mode */
        .nowrap-textarea {
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
        }
        
        /* Tab Active State */
        .tab-active {
            background-color: #3b82f6;
            color: white;
            box-shadow: 0 4px 14px 0 rgba(59, 111, 224, 0.39);
        }
        .tab-inactive {
            background-color: rgba(255, 255, 255, 0.2);
            color: #e2e8f0;
        }
        .tab-inactive:hover { background-color: rgba(255, 255, 255, 0.3); color: white; }
    </style>
</head>

<body class="antialiased min-h-screen relative text-slate-800">

    <div class="hero-bg"></div>

    <!-- Fixed Navbar -->
    <nav class="fixed top-0 w-full bg-[#f4f7fe]/90 backdrop-blur-md z-50 border-b border-white/20 transition-all duration-300 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center gap-2 cursor-pointer">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-cube text-white text-sm"></i>
                    </div>
                    <span class="font-bold text-xl text-slate-800 tracking-tight">Pranto's<span class="text-blue-600 font-light">Workspace</span></span>
                </div>

                <!-- Nav Links -->
                <div class="hidden md:flex space-x-8 items-center">
                    <a href="index.html" class="text-slate-500 hover:text-slate-800 font-medium transition-colors">HOME</a>
                </div>

                <!-- Profile -->
                <div class="flex items-center gap-4">
                    <button class="w-8 h-8 rounded-full bg-slate-200/50 flex items-center justify-center text-slate-600 hover:bg-slate-200 transition-colors">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                    <div class="w-8 h-8 rounded-full border-2 border-white shadow-sm overflow-hidden bg-blue-100">
                        <img src="https://placehold.co/100x100/3b82f6/ffffff?text=PR" alt="Profile" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="relative z-10 pt-28 pb-16 px-4 sm:px-6 lg:px-8 max-w-6xl mx-auto flex flex-col min-h-screen">
        
        <div class="text-center mb-6">
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-3 tracking-tight">Batch File Renamer</h1>
            <p class="text-blue-100 text-base max-w-2xl mx-auto font-light mb-6">Instantly duplicate and rename ANY files (PDF, Word, Excel, Images) based on your ticket lists.</p>
            
            <!-- Mode Toggle Tabs -->
            <div class="flex justify-center gap-4">
                <button id="btnSingle" onclick="switchMode('single')" class="px-6 py-2.5 rounded-full font-semibold transition-all duration-300 tab-active flex items-center gap-2">
                    <i class="fa-regular fa-file"></i> Single Template
                </button>
                <button id="btnMulti" onclick="switchMode('multi')" class="px-6 py-2.5 rounded-full font-semibold transition-all duration-300 tab-inactive flex items-center gap-2 border border-white/20">
                    <i class="fa-regular fa-copy"></i> Multiple Templates
                </button>
            </div>
        </div>

        <!-- Main Card -->
        <div class="bg-white/90 backdrop-blur-xl rounded-[2rem] shadow-premium p-6 md:p-8 border border-white/50 flex-grow flex flex-col relative overflow-hidden">
            
            <!-- ================= SINGLE MODE ================= -->
            <div id="singleModeSection" class="flex-grow flex flex-col transition-all duration-500">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 flex-grow">
                    <!-- Left: Upload -->
                    <div class="flex flex-col h-full">
                        <h2 class="text-lg font-bold text-slate-800 flex items-center mb-4">
                            <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center mr-3 shadow-sm"><i class="fa-solid fa-upload"></i></div>
                            1. Upload Template File
                        </h2>
                        
                        <label id="dropZoneSingle" for="pdfUploadSingle" class="flex-1 flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-2xl bg-slate-50/50 hover:bg-blue-50/50 hover:border-blue-300 cursor-pointer transition-all p-8 text-center group relative min-h-[250px]">
                            <div class="w-16 h-16 bg-white rounded-full shadow-sm border border-slate-100 flex items-center justify-center mb-4 group-hover:scale-110 transition-all z-10">
                                <i class="fa-solid fa-cloud-arrow-up text-2xl text-blue-500"></i>
                            </div>
                            <h3 class="text-slate-800 font-semibold text-lg mb-1 z-10">Click or Drag Any File</h3>
                            <span class="px-4 py-2 mt-3 bg-white text-blue-600 text-sm font-semibold rounded-lg shadow-sm border border-slate-200 z-10">Select File</span>
                            
                            <!-- Success overlay -->
                            <div id="overlaySingle" class="absolute inset-0 bg-blue-50/95 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 rounded-2xl">
                                <i class="fa-solid fa-file-circle-check text-4xl text-blue-500 mb-2"></i>
                                <p id="fileNameSingle" class="text-slate-800 font-medium px-4 text-center break-all"></p>
                            </div>
                        </label>
                        <input type="file" id="pdfUploadSingle" onchange="handleFileSingle(event)">
                    </div>

                    <!-- Right: Tickets -->
                    <div class="flex flex-col h-full">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-lg font-bold text-slate-800 flex items-center">
                                <div class="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center mr-3 shadow-sm"><i class="fa-solid fa-list-ol"></i></div>
                                2. Paste Tickets
                            </h2>
                            <div class="bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1" id="counterBadgeSingle">
                                <span id="countSingle">0</span>
                            </div>
                        </div>
                        
                        <textarea id="ticketsSingle" oninput="updateCountSingle()" class="w-full flex-1 min-h-[250px] p-5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all resize-none font-mono text-sm" placeholder="150258373&#10;150266403..."></textarea>
                    </div>
                </div>

                <div class="mt-8 text-center">
                    <button id="btnGenerateSingle" onclick="processSingle()" class="px-8 py-3.5 bg-primary text-white font-bold rounded-xl shadow-btn hover:shadow-lg hover:-translate-y-0.5 transition-all flex items-center gap-3 mx-auto">
                        <i class="fa-solid fa-file-zipper"></i> <span id="btnTextSingle">Generate & Download</span>
                    </button>
                    <div id="statusSingle" class="mt-3 text-sm font-medium h-5"></div>
                </div>
            </div>

            <!-- ================= MULTIPLE MODE ================= -->
            <div id="multiModeSection" class="hidden flex-grow flex flex-col transition-all duration-500">
                
                <!-- Top Row: Upload Multiple Files -->
                <div class="mb-6">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center mb-3">
                        <div class="w-8 h-8 rounded-lg bg-purple-100 text-purple-600 flex items-center justify-center mr-3"><i class="fa-solid fa-layer-group"></i></div>
                        1. Upload Base Files
                    </h2>
                    <label class="flex flex-col items-center justify-center border-2 border-dashed border-purple-200 rounded-xl bg-purple-50/30 hover:bg-purple-50 p-6 cursor-pointer transition-all">
                        <i class="fa-solid fa-folder-open text-3xl text-purple-400 mb-2"></i>
                        <span class="text-sm font-medium text-slate-600">Select multiple file templates</span>
                        <input type="file" id="pdfUploadMulti" multiple onchange="handleFileMulti(event)" class="hidden">
                    </label>
                    <div id="uploadedListMulti" class="mt-2 flex flex-wrap gap-2 text-xs text-slate-500"></div>
                </div>

                <!-- Bottom Row: Mapping Grids -->
                <div class="grid grid-cols-2 gap-4 flex-grow">
                    <!-- Base File Names Box -->
                    <div class="flex flex-col h-full relative">
                        <h3 class="text-sm font-semibold text-slate-700 mb-2 flex justify-between">
                            <span>Base File Names</span> <span id="lineCountA" class="text-slate-400">0 lines</span>
                        </h3>
                        <textarea id="multiBoxA" class="w-full flex-1 p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none font-mono text-sm nowrap-textarea leading-relaxed" placeholder="CCF_000129&#10;CCF_000130"></textarea>
                    </div>

                    <!-- Tickets Box -->
                    <div class="flex flex-col h-full relative">
                        <h3 class="text-sm font-semibold text-slate-700 mb-2 flex justify-between">
                            <span>Tickets (Comma Separated)</span> <span id="lineCountB" class="text-slate-400">0 lines</span>
                        </h3>
                        <textarea id="multiBoxB" class="w-full flex-1 p-4 bg-slate-50 border border-slate-200 rounded-xl outline-none font-mono text-sm nowrap-textarea leading-relaxed" placeholder="150263736, 150264398&#10;3198, 3642"></textarea>
                    </div>
                </div>

                <!-- Live Validation Status -->
                <div id="multiValidationBox" class="mt-4 p-3 rounded-xl bg-slate-100 text-sm text-slate-600 border border-slate-200 min-h-[50px] max-h-[100px] overflow-y-auto font-mono text-xs">
                    Waiting for input...
                </div>

                <div class="mt-6 text-center">
                    <button id="btnGenerateMulti" onclick="processMulti()" class="px-8 py-3.5 bg-purple-600 text-white font-bold rounded-xl shadow-btn hover:shadow-lg hover:-translate-y-0.5 transition-all flex items-center gap-3 mx-auto">
                        <i class="fa-solid fa-cogs"></i> <span id="btnTextMulti">Process & Download ZIP</span>
                    </button>
                    <div id="statusMulti" class="mt-3 text-sm font-medium h-5"></div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- Tab Switching Logic ---
        const secSingle = document.getElementById('singleModeSection');
        const secMulti = document.getElementById('multiModeSection');
        const btnSingle = document.getElementById('btnSingle');
        const btnMulti = document.getElementById('btnMulti');

        function switchMode(mode) {
            if (mode === 'single') {
                secSingle.classList.remove('hidden');
                secMulti.classList.add('hidden');
                
                btnSingle.className = "px-6 py-2.5 rounded-full font-semibold transition-all duration-300 tab-active flex items-center gap-2";
                btnMulti.className = "px-6 py-2.5 rounded-full font-semibold transition-all duration-300 tab-inactive flex items-center gap-2 border border-white/20";
            } else {
                secSingle.classList.add('hidden');
                secMulti.classList.remove('hidden');
                
                btnMulti.className = "px-6 py-2.5 rounded-full font-semibold transition-all duration-300 bg-purple-500 text-white shadow-btn flex items-center gap-2 border-transparent";
                btnSingle.className = "px-6 py-2.5 rounded-full font-semibold transition-all duration-300 tab-inactive flex items-center gap-2 border border-white/20";
            }
        }

        // ================= SINGLE MODE LOGIC =================
        let fileSingle = null;
        let fileSingleExt = "pdf"; // Default fallback
        
        function handleFileSingle(e) {
            const file = e.target.files[0];
            if(file) {
                fileSingle = file;
                fileSingleExt = file.name.split('.').pop() || "pdf"; // Detect exact extension
                document.getElementById('fileNameSingle').textContent = file.name;
                document.getElementById('overlaySingle').classList.remove('opacity-0', 'pointer-events-none');
            }
        }

        function updateCountSingle() {
            const text = document.getElementById('ticketsSingle').value;
            // Split by newline, comma, or spaces
            const rawTickets = text.split(/[\n,\s]+/).map(t=>t.trim()).filter(t=>t!=="");
            // Show exact count including duplicates
            document.getElementById('countSingle').textContent = rawTickets.length;
        }

        async function processSingle() {
            const ticketsText = document.getElementById('ticketsSingle').value;
            // Split
            const tickets = ticketsText.split(/[\n,\s]+/).map(t=>t.trim()).filter(t=>t!=="");
            if(!fileSingle) return alert("Please upload a base file.");
            if(tickets.length === 0) return alert("Please paste ticket numbers.");

            const btn = document.getElementById('btnGenerateSingle');
            const status = document.getElementById('statusSingle');

            btn.disabled = true; btn.style.opacity = '0.7';
            status.innerHTML = `<span class="text-blue-500"><i class="fa-solid fa-spinner fa-spin"></i> Processing...</span>`;

            try {
                const zip = new JSZip();
                const buffer = await fileSingle.arrayBuffer();
                
                const nameCounts = {};

                tickets.forEach(ticket => {
                    // FORCE UPPERCASE
                    let safeName = ticket.replace(/[^a-zA-Z0-9_-]/gi, '').toUpperCase();
                    
                    // Handle duplicates by adding _2, _3 etc.
                    if (nameCounts[safeName]) {
                        nameCounts[safeName]++;
                        safeName = `${safeName}_${nameCounts[safeName]}`;
                    } else {
                        nameCounts[safeName] = 1;
                    }

                    // Force PDF extension regardless of input format
                    zip.file(`${safeName}.pdf`, buffer);
                });

                const content = await zip.generateAsync({type:"blob"});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `Tickets_SingleMode_${Date.now()}.zip`;
                link.click();
                
                status.innerHTML = `<span class="text-green-600"><i class="fa-solid fa-check"></i> Generated ${tickets.length} files successfully!</span>`;
            } catch(e) {
                status.innerHTML = `<span class="text-red-500">Error generating files.</span>`;
            } finally {
                btn.disabled = false; btn.style.opacity = '1';
            }
        }

        // ================= MULTIPLE MODE LOGIC =================
        let filesMulti = {}; // Store {buffer, ext}

        function handleFileMulti(e) {
            const fileList = e.target.files;
            filesMulti = {}; // reset
            const listDiv = document.getElementById('uploadedListMulti');
            listDiv.innerHTML = '';
            let autoNames = []; // To store file names for the left box

            Array.from(fileList).forEach(file => {
                if(file) {
                    const reader = new FileReader();
                    const ext = file.name.split('.').pop() || "pdf"; // Detect exact extension
                    
                    reader.onload = (evt) => {
                        filesMulti[file.name] = { buffer: evt.target.result, ext: ext }; 
                    };
                    reader.readAsArrayBuffer(file);
                    
                    // Show pill in UI
                    const span = document.createElement('span');
                    span.className = "px-2 py-1 bg-purple-100 text-purple-700 rounded-md border border-purple-200";
                    span.textContent = file.name;
                    listDiv.appendChild(span);

                    // Add file name without ANY extension for the text area
                    autoNames.push(file.name.replace(/\.[^/.]+$/, ""));
                }
            });

            // Auto-fill the Base File Names box
            const boxA = document.getElementById('multiBoxA');
            boxA.value = autoNames.join('\n');
            
            // Trigger validation to update counts and UI immediately
            setTimeout(validateMulti, 50);
        }

        // Synchronized Scrolling for Textareas
        const boxA = document.getElementById('multiBoxA');
        const boxB = document.getElementById('multiBoxB');
        
        boxA.addEventListener('scroll', () => { boxB.scrollTop = boxA.scrollTop; });
        boxB.addEventListener('scroll', () => { boxA.scrollTop = boxB.scrollTop; });

        // Live Validation Logic
        boxA.addEventListener('input', validateMulti);
        boxB.addEventListener('input', validateMulti);

        function validateMulti() {
            // Remove trailing empty lines for accurate count
            let linesA = boxA.value.replace(/\n+$/, "").split('\n');
            let linesB = boxB.value.replace(/\n+$/, "").split('\n');
            
            // Handle edge case where box is completely empty
            if(boxA.value.trim() === '') linesA = [];
            if(boxB.value.trim() === '') linesB = [];

            document.getElementById('lineCountA').textContent = `${linesA.length} lines`;
            document.getElementById('lineCountB').textContent = `${linesB.length} lines`;

            const validBox = document.getElementById('multiValidationBox');

            // 1. Check Line Length Mismatch
            if (linesA.length !== linesB.length) {
                validBox.className = "mt-4 p-3 rounded-xl bg-red-50 text-red-600 border border-red-200 min-h-[50px] max-h-[100px] overflow-y-auto font-mono text-xs";
                validBox.innerHTML = `<strong><i class="fa-solid fa-triangle-exclamation"></i> Error: Mismatch!</strong><br>You have ${linesA.length} file names but ${linesB.length} ticket lines. They must match exactly.`;
                return;
            }

            // 2. Mapping Info
            if(linesA.length === 0) {
                validBox.className = "mt-4 p-3 rounded-xl bg-slate-100 text-slate-600 border border-slate-200 min-h-[50px] max-h-[100px] overflow-y-auto font-mono text-xs";
                validBox.innerHTML = "Waiting for input...";
                return;
            }

            let htmlLog = `<strong class="text-green-600"><i class="fa-solid fa-check-circle"></i> Lines matched (${linesA.length}). Mapping preview:</strong><br>`;
            
            linesA.forEach((pdfName, index) => {
                const ticketsRaw = linesB[index] || "";
                const tCount = ticketsRaw.split(',').map(x=>x.trim()).filter(x=>x!=="").length;
                
                const uploadedNames = Object.keys(filesMulti);
                let foundMatch = false;
                let cleanPdfName = pdfName.trim();
                
                // Loose match ignoring extension
                if(uploadedNames.some(name => name === cleanPdfName || name.replace(/\.[^/.]+$/, "") === cleanPdfName)) {
                    foundMatch = true;
                }

                const fileStatusIcon = foundMatch ? '<span class="text-green-500"><i class="fa-solid fa-file-circle-check"></i></span>' : '<span class="text-orange-500" title="File not uploaded yet"><i class="fa-solid fa-circle-question"></i></span>';

                htmlLog += `L${index+1}: ${fileStatusIcon} [${cleanPdfName}] ➔ ${tCount} Tickets<br>`;
            });

            validBox.className = "mt-4 p-3 rounded-xl bg-green-50 text-slate-700 border border-green-200 min-h-[50px] max-h-[100px] overflow-y-auto font-mono text-xs leading-relaxed";
            validBox.innerHTML = htmlLog;
        }

        async function processMulti() {
            let linesA = boxA.value.replace(/\n+$/, "").split('\n');
            let linesB = boxB.value.replace(/\n+$/, "").split('\n');
            const status = document.getElementById('statusMulti');
            const btn = document.getElementById('btnGenerateMulti');

            if(linesA.length !== linesB.length) {
                alert("Line count mismatch! Please fix the errors in red before generating.");
                return;
            }
            if(Object.keys(filesMulti).length === 0) {
                alert("Please upload at least one base file first.");
                return;
            }

            btn.disabled = true; btn.style.opacity = '0.7';
            status.innerHTML = `<span class="text-purple-600"><i class="fa-solid fa-spinner fa-spin"></i> Building mapping & ZIP...</span>`;

            try {
                const zip = new JSZip();
                let filesGenerated = 0;
                const nameCounts = {}; // Track duplicate names across the ZIP

                for(let i=0; i<linesA.length; i++) {
                    let pdfQuery = linesA[i].trim();
                    let ticketsStr = linesB[i];
                    
                    if(!pdfQuery) continue;

                    const uploadedNames = Object.keys(filesMulti);
                    // Find exactly matching key, or key without its extension
                    let matchedKey = uploadedNames.find(name => name === pdfQuery || name.replace(/\.[^/.]+$/, "") === pdfQuery);
                    let fileData = matchedKey ? filesMulti[matchedKey] : null;

                    if(!fileData) {
                        console.warn(`Could not find base file for: ${pdfQuery}. Skipping row ${i+1}.`);
                        continue; 
                    }

                    // Process Tickets for this File
                    let ticketsArray = ticketsStr.split(',').map(t=>t.trim()).filter(t=>t!=="");
                    
                    ticketsArray.forEach(tkt => {
                        // FORCE UPPERCASE for output
                        let cleanName = tkt.replace(/[^a-zA-Z0-9_-]/gi, '').toUpperCase();
                        
                        // Handle duplicates
                        if (nameCounts[cleanName]) {
                            nameCounts[cleanName]++;
                            cleanName = `${cleanName}_${nameCounts[cleanName]}`;
                        } else {
                            nameCounts[cleanName] = 1;
                        }

                        // Force PDF extension regardless of input format
                        zip.file(`${cleanName}.pdf`, fileData.buffer);
                        filesGenerated++;
                    });
                }

                if(filesGenerated === 0) {
                    throw new Error("No files matched to generate.");
                }

                const content = await zip.generateAsync({type:"blob"});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `Tickets_MultiMode_${Date.now()}.zip`;
                link.click();
                
                status.innerHTML = `<span class="text-green-600"><i class="fa-solid fa-check"></i> Success! Created ${filesGenerated} files.</span>`;
            } catch(e) {
                console.error(e);
                status.innerHTML = `<span class="text-red-500">Error: ${e.message}</span>`;
            } finally {
                btn.disabled = false; btn.style.opacity = '1';
            }
        }
    </script>
</body>
</html>
