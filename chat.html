<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pranto's Workspace - Comm Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap');
        :root {
            --font-head: 'Outfit', sans-serif; --font-body: 'Inter', sans-serif;
            --primary: #6366f1; --primary-rgb: 99, 102, 241; --secondary: #0ea5e9; --accent: #f43f5e;
            --bg-color: #050505; --glass-bg: rgba(20, 20, 25, 0.6); --glass-border: 1px solid rgba(255, 255, 255, 0.05);
            --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); --input-bg: rgba(15, 15, 20, 0.8);
            --text-main: #f8fafc; --text-sub: #94a3b8;
        }
        body { font-family: var(--font-body); background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .bg-mesh { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
        .blob { position: absolute; filter: blur(100px); opacity: 0.3; border-radius: 50%; animation: floatBlob 20s infinite alternate ease-in-out; }
        .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: rgba(99, 102, 241, 0.15); }
        .blob-2 { bottom: -20%; right: -10%; width: 600px; height: 600px; background: rgba(244, 63, 94, 0.1); }
        .blob-3 { top: 40%; left: 40%; width: 400px; height: 400px; background: rgba(14, 165, 233, 0.1); }
        @keyframes floatBlob { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.1); } }
        .text-gradient { background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(20px); border: var(--glass-border); border-radius: 16px; transition: all 0.3s ease; }
        #loginOverlay, #adminLoginOverlay { position: fixed; inset: 0; background: rgba(5,5,5,0.95); backdrop-filter: blur(15px); z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: rgba(15,15,20,0.9); border: var(--glass-border); border-radius: 24px; padding: 40px; width: 100%; max-width: 400px; }
        .auth-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px 16px; color: white; outline: none; }
        .chat-container { height: calc(100vh - 100px); display: flex; overflow: hidden; margin-top: 80px; }
        .contact-list { width: 300px; border-right: var(--glass-border); display: flex; flex-direction: column; background: rgba(15,15,20,0.3); }
        .contact-item { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .contact-item.active { background: rgba(99, 102, 241, 0.15); border-left: 4px solid var(--primary); }
        .unread-badge { background-color: var(--accent); color: white; font-size: 0.6rem; font-weight: bold; padding: 2px 6px; border-radius: 10px; display: none; }
        .unread-badge.show { display: inline-block; }
        .chat-area { flex-grow: 1; display: flex; flex-direction: column; position: relative; }
        .chat-header { padding: 15px 20px; border-bottom: var(--glass-border); display: flex; justify-content: space-between; align-items: center; background: rgba(15,15,20,0.5); }
        .chat-messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .chat-input-area { padding: 15px 20px; border-top: var(--glass-border); display: flex; align-items: center; gap: 10px; background: rgba(15,15,20,0.5); }
        .msg-input { flex-grow: 1; background: var(--input-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 100px; padding: 12px 20px; color: white; outline: none; }
        .send-btn { background: var(--primary); border: none; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; }
        .msg-wrap { display: flex; max-width: 75%; flex-direction: column; }
        .msg-wrap.mine { align-self: flex-end; align-items: flex-end; }
        .msg-wrap.theirs { align-self: flex-start; align-items: flex-start; }
        .bubble { padding: 10px 16px; border-radius: 18px; font-size: 0.9rem; line-height: 1.4; word-wrap: break-word; }
        .msg-wrap.mine .bubble { background: linear-gradient(135deg, var(--primary), #818cf8); color: white; border-bottom-right-radius: 4px; }
        .msg-wrap.theirs .bubble { background: rgba(255,255,255,0.1); color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
        .side-panel { position: absolute; top: 70px; right: 20px; width: 300px; background: rgba(15,15,20,0.95); backdrop-filter: blur(20px); border: var(--glass-border); border-radius: 16px; padding: 15px; z-index: 100; display: none; }
        .side-panel.active { display: block; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .nav-wrapper { position: fixed; top: 15px; left: 0; width: 100%; z-index: 50; display: flex; justify-content: center; padding: 0 20px; }
        .nav-pill { width: 100%; max-width: 1400px; height: 55px; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; border-radius: 100px; background: var(--glass-bg); backdrop-filter: blur(30px); border: var(--glass-border); }
        .avatar-circle { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; font-size: 0.9rem; overflow: hidden; }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div class="bg-mesh"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>

    <!-- Login Overlay -->
    <div id="loginOverlay">
        <div class="auth-card text-center relative">
            <button onclick="showAdminLogin()" class="absolute top-4 right-4 text-slate-500 hover:text-white transition"><i class="fas fa-user-shield"></i></button>
            <div class="w-16 h-16 mx-auto bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center text-white mb-4">
                <i class="fas fa-bolt text-2xl"></i>
            </div>
            <h2 class="font-bold text-2xl text-white mb-1">Comm Center</h2>
            <p class="text-xs text-slate-500 mb-6">Enter prefix to access (e.g. pranto.rodrix)</p>
            <div class="relative flex items-center mb-4">
                <input type="text" id="emailInput" class="auth-input pr-[140px]" placeholder="your.name" onkeypress="if(event.key === 'Enter') login()">
                <span class="absolute right-4 text-xs text-slate-500 select-none">@leverngear.com</span>
            </div>
            <p id="loginError" class="text-xs text-rose-500 hidden mb-4">Access Denied!</p>
            <button onclick="login()" class="w-full bg-[#6366f1] text-white font-bold py-3 rounded-xl transition-all">Connect</button>
        </div>
    </div>

    <!-- Admin Login -->
    <div id="adminLoginOverlay" style="display:none;">
        <div class="auth-card text-center relative">
            <button onclick="hideAdminLogin()" class="absolute top-4 left-4 text-slate-500 hover:text-white transition"><i class="fas fa-arrow-left"></i></button>
            <h2 class="font-bold text-2xl text-white mb-1">System Admin</h2>
            <input type="email" id="adminEmailInput" class="auth-input mb-3" placeholder="Admin Email">
            <input type="password" id="adminPassInput" class="auth-input mb-4" placeholder="Password (1234)" onkeypress="if(event.key === 'Enter') adminLogin()">
            <p id="adminLoginError" class="text-xs text-rose-500 hidden mb-4">Invalid Credentials!</p>
            <button onclick="adminLogin()" class="w-full bg-rose-600 text-white font-bold py-3 rounded-xl transition-all">Authenticate</button>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="nav-wrapper">
        <div class="nav-pill">
            <div class="font-bold text-lg text-gradient flex items-center">
                <i class="fas fa-network-wired mr-2"></i> Comm Center <i id="loadingSpinner" class="fas fa-circle-notch fa-spin ml-2 hidden"></i>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 cursor-pointer" onclick="toggleProfilePanel()">
                    <div id="navAvatar" class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-white overflow-hidden"></div>
                    <span id="navUserName" class="text-sm font-semibold text-slate-400 hidden sm:block"></span>
                </div>
                <button onclick="logout()" class="bg-rose-500/10 text-rose-400 px-4 py-1.5 rounded-full text-xs font-bold transition-all border border-rose-500/20">Exit</button>
            </div>
        </div>
    </nav>

    <main class="w-full max-w-[1400px] mx-auto px-4">
        <div class="glass-panel chat-container">
            <div class="contact-list" id="contactList">
                <div class="p-4 border-b border-white/5 text-xs font-bold text-slate-500 uppercase flex justify-between items-center">
                    <span>Networks</span>
                    <button id="mainAdminBtn" onclick="toggleAdminPanel()" class="hidden text-slate-500 hover:text-white"><i class="fas fa-cogs"></i></button>
                </div>
                <div id="contactsContainer" class="overflow-y-auto flex-grow"></div>
            </div>

            <div class="chat-area">
                <div class="chat-header">
                    <div class="flex items-center gap-3">
                        <div id="activeAvatar" class="avatar-circle bg-slate-700">--</div>
                        <div><h4 id="activeName" class="font-bold text-white text-sm m-0">Select Network</h4><span id="activeStatus" class="text-[10px] text-slate-500">--</span></div>
                    </div>
                    <button id="groupSettingsBtn" onclick="toggleGroupPanel()" class="hidden text-slate-400 hover:text-white"><i class="fas fa-users-cog"></i></button>
                </div>

                <div id="adminPanel" class="side-panel">
                    <h5 class="text-xs font-bold text-slate-500 uppercase mb-3 border-b border-white/10 pb-2 flex justify-between">User Management <button onclick="toggleAdminPanel()"><i class="fas fa-times"></i></button></h5>
                    <div class="flex gap-2 mb-3"><input type="text" id="newEmailPrefix" class="auth-input text-xs" placeholder="new.user"><button onclick="addNewUser()" class="bg-indigo-500 text-white px-3 py-2 rounded-lg text-xs font-bold">Add</button></div>
                    <div id="adminUsersList" class="space-y-2 max-h-[200px] overflow-y-auto"></div>
                </div>

                <div id="groupPanel" class="side-panel">
                    <h5 class="text-xs font-bold text-slate-500 uppercase mb-3 border-b border-white/10 pb-2 flex justify-between">Group Members <button onclick="toggleGroupPanel()"><i class="fas fa-times"></i></button></h5>
                    <div id="groupMembersList" class="space-y-2 max-h-[200px] overflow-y-auto"></div>
                </div>

                <div id="profilePanel" class="side-panel">
                    <h5 class="text-xs font-bold text-slate-500 uppercase mb-3 border-b border-white/10 pb-2 flex justify-between">Settings <button onclick="toggleProfilePanel()"><i class="fas fa-times"></i></button></h5>
                    <div class="flex flex-col items-center gap-3"><div id="profilePanelAvatar" class="w-16 h-16 rounded-full flex items-center justify-center text-xl font-bold overflow-hidden"></div><input type="file" id="avatarUpload" accept="image/*" class="hidden" onchange="handleAvatarUpload(event)"><label for="avatarUpload" class="text-xs bg-white/10 px-3 py-2 rounded-lg cursor-pointer">Change Photo</label></div>
                </div>

                <div class="chat-messages" id="chatBox"></div>

                <div class="chat-input-area hidden" id="chatInputArea">
                    <button onclick="enhanceMessage()" class="w-10 h-10 rounded-full bg-amber-500/10 text-amber-500 border border-amber-500/20 flex items-center justify-center" title="AI Enhance"><i class="fas fa-magic"></i></button>
                    <input type="text" id="msgInput" class="msg-input" placeholder="Transmit message..." onkeypress="handleEnter(event)">
                    <button onclick="sendMessage()" class="send-btn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, doc, setDoc, onSnapshot, getDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const myFirebaseConfig = {
            apiKey: "AIzaSyBn__xwzTygfgz6xuQFxRnxpGpvKCZfpm4",
            authDomain: "workspacechat-2bffe.firebaseapp.com",
            projectId: "workspacechat-2bffe",
            storageBucket: "workspacechat-2bffe.firebasestorage.app",
            messagingSenderId: "1086571655842",
            appId: "1:1086571655842:web:ae663facc3bd6c1942ddfb",
            measurementId: "G-LCFKLPVRQ1"
        };

        const app = initializeApp(myFirebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'pranto-chat-pro-app';

        const BASE_USERS = {
            'pranto.rodrix@leverngear.com': { name: 'Pranto Rodrix', role: 'admin', color: 'from-blue-500 to-indigo-600', short: 'PR' },
            'rakibul.sumon@leverngear.com': { name: 'Rakibul Sumon', role: 'user', color: 'from-emerald-500 to-teal-600', short: 'RS' },
            'sayemul.islam@leverngear.com': { name: 'Sayemul Islam', role: 'user', color: 'from-orange-500 to-rose-600', short: 'SI' },
            'gemini@workspace.ai': { name: 'Gemini AI ✨', role: 'assistant', color: 'from-cyan-400 to-blue-500', short: 'AI' }
        };
        
        let ALLOWED_USERS = { ...BASE_USERS };
        let currentUser = null, activeChatId = null, activeChatType = null, allCloudMessages = [], groupMembers = [], unreadCounts = {};

        window.login = () => {
            const pre = document.getElementById('emailInput').value.trim().toLowerCase();
            const email = `${pre}@leverngear.com`;
            if (ALLOWED_USERS[email]) { localStorage.setItem('workspace_active_user', email); checkLocalAuth(); }
            else document.getElementById('loginError').classList.remove('hidden');
        };

        window.logout = () => { localStorage.removeItem('workspace_active_user'); location.reload(); };
        window.showAdminLogin = () => document.getElementById('adminLoginOverlay').style.display = 'flex';
        window.hideAdminLogin = () => document.getElementById('adminLoginOverlay').style.display = 'none';
        window.adminLogin = () => { if(document.getElementById('adminEmailInput').value === 'pranto.rodrix@leverngear.com' && document.getElementById('adminPassInput').value === '1234') { localStorage.setItem('workspace_active_user', 'pranto.rodrix@leverngear.com'); checkLocalAuth(); hideAdminLogin(); } };
        window.handleEnter = (e) => { if(e.key === 'Enter') sendMessage(); };
        window.toggleAdminPanel = () => { document.getElementById('adminPanel').classList.toggle('active'); renderAdminPanel(); };
        window.toggleGroupPanel = () => { document.getElementById('groupPanel').classList.toggle('active'); renderGroupPanel(); };
        window.toggleProfilePanel = () => document.getElementById('profilePanel').classList.toggle('active');
        
        window.handleAvatarUpload = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => { localStorage.setItem(`avatar_${currentUser.email}`, ev.target.result); updateAvatarsInUI(); };
            reader.readAsDataURL(e.target.files[0]);
        };

        async function checkLocalAuth() {
            const saved = localStorage.getItem('workspace_active_user');
            if (saved) { document.getElementById('loginOverlay').style.display = 'none'; document.getElementById('loadingSpinner').classList.remove('hidden'); await signInAnonymously(auth); }
        }

        onAuthStateChanged(auth, async (u) => {
            if (u) {
                const saved = localStorage.getItem('workspace_active_user');
                const docSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'appSettings', 'usersList'));
                if (docSnap.exists()) ALLOWED_USERS = { ...BASE_USERS, ...docSnap.data().users };
                if(saved && ALLOWED_USERS[saved]) {
                    currentUser = { email: saved, ...ALLOWED_USERS[saved] };
                    document.getElementById('navUserName').innerText = currentUser.name;
                    updateAvatarsInUI();
                    if(currentUser.role === 'admin') document.getElementById('mainAdminBtn').classList.remove('hidden');
                    setupCloudListeners();
                }
            }
        });

        function setupCloudListeners() {
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), (snap) => {
                allCloudMessages = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => a.timestamp - b.timestamp);
                calculateUnread();
                renderContacts();
                if(activeChatId) renderMessages();
                document.getElementById('loadingSpinner').classList.add('hidden');
            });
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'groupSettings', 'members'), (snap) => {
                groupMembers = snap.exists() ? snap.data().emails : Object.keys(ALLOWED_USERS).filter(e => e !== 'gemini@workspace.ai');
                renderContacts();
            });
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'appSettings', 'usersList'), (snap) => {
                if(snap.exists()) { ALLOWED_USERS = { ...BASE_USERS, ...snap.data().users }; renderContacts(); }
            });
        }

        function getUserAvatarHTML(email, u) {
            const img = localStorage.getItem(`avatar_${email}`);
            return img ? `<img src="${img}" class="avatar-img">` : (email === 'gemini@workspace.ai' ? '<i class="fas fa-robot"></i>' : `<span>${u.short}</span>`);
        }

        function updateAvatarsInUI() {
            const html = getUserAvatarHTML(currentUser.email, currentUser);
            document.getElementById('navAvatar').innerHTML = html;
            document.getElementById('navAvatar').className = `w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white overflow-hidden bg-gradient-to-r ${currentUser.color}`;
            document.getElementById('profilePanelAvatar').innerHTML = html;
            document.getElementById('profilePanelAvatar').className = `w-16 h-16 rounded-full flex items-center justify-center text-xl font-bold bg-gradient-to-r ${currentUser.color}`;
            renderContacts();
        }

        function calculateUnread() {
            unreadCounts = {};
            const lastRead = JSON.parse(localStorage.getItem('workspace_last_read')) || {};
            allCloudMessages.forEach(m => {
                if(m.sender === currentUser.email) return;
                let cid = m.chatId === 'group' ? 'group' : m.sender;
                if(m.chatId !== 'group' && !m.chatId.includes(currentUser.email)) return;
                if(!lastRead[cid] || m.timestamp > lastRead[cid]) unreadCounts[cid] = (unreadCounts[cid] || 0) + 1;
            });
        }

        window.openChat = (id, type) => {
            activeChatId = id; activeChatType = type;
            const lr = JSON.parse(localStorage.getItem('workspace_last_read')) || {};
            lr[id] = Date.now();
            localStorage.setItem('workspace_last_read', JSON.stringify(lr));
            const u = type === 'group' ? {name: 'Team Network', color: 'from-purple-500 to-pink-600'} : ALLOWED_USERS[id];
            document.getElementById('activeAvatar').innerHTML = type === 'group' ? '<i class="fas fa-users"></i>' : getUserAvatarHTML(id, u);
            document.getElementById('activeAvatar').className = `avatar-circle bg-gradient-to-r ${u.color}`;
            document.getElementById('activeName').innerText = u.name;
            document.getElementById('activeStatus').innerText = type === 'group' ? groupMembers.length + ' Linked' : 'Direct Link';
            document.getElementById('chatInputArea').classList.remove('hidden');
            document.getElementById('groupSettingsBtn').className = type === 'group' && groupMembers.includes(currentUser.email) ? 'block' : 'hidden';
            calculateUnread(); renderContacts(); renderMessages();
        };

        window.sendMessage = async () => {
            const inp = document.getElementById('msgInput');
            const txt = inp.value.trim();
            if(!txt || !activeChatId) return;
            const key = activeChatType === 'group' ? 'group' : [currentUser.email, activeChatId].sort().join('|');
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), { chatId: key, sender: currentUser.email, text: txt, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), timestamp: Date.now() });
            inp.value = '';
        };

        function renderContacts() {
            const container = document.getElementById('contactsContainer');
            container.innerHTML = '';
            const gUr = unreadCounts['group'] || 0;
            container.innerHTML += `<div class="contact-item ${activeChatId === 'group' ? 'active' : ''}" onclick="openChat('group', 'group')"><div class="flex items-center gap-3"><div class="avatar-circle bg-gradient-to-r from-purple-500 to-pink-600"><i class="fas fa-users"></i></div><div><div class="text-sm font-bold text-white">Team Network</div><div class="text-[10px] text-slate-500">${groupMembers.includes(currentUser.email) ? 'Linked' : 'Restricted'}</div></div></div><div class="unread-badge ${gUr > 0 && activeChatId !== 'group' ? 'show' : ''}">${gUr}</div></div>`;
            Object.keys(ALLOWED_USERS).forEach(email => {
                if(email === currentUser.email) return;
                const u = ALLOWED_USERS[email], ur = unreadCounts[email] || 0;
                container.innerHTML += `<div class="contact-item ${activeChatId === email ? 'active' : ''}" onclick="openChat('${email}', 'personal')"><div class="flex items-center gap-3"><div class="avatar-circle bg-gradient-to-r ${u.color}">${getUserAvatarHTML(email, u)}</div><div><div class="text-sm font-bold text-white">${u.name}</div><div class="text-[10px] text-slate-500 capitalize">${u.role}</div></div></div><div class="unread-badge ${ur > 0 && activeChatId !== email ? 'show' : ''}">${ur}</div></div>`;
            });
        }

        function renderMessages() {
            const chatBox = document.getElementById('chatBox');
            if(activeChatType === 'group' && !groupMembers.includes(currentUser.email)) { chatBox.innerHTML = '<p class="m-auto opacity-50">Restricted.</p>'; return; }
            const key = activeChatType === 'group' ? 'group' : [currentUser.email, activeChatId].sort().join('|');
            const msgs = allCloudMessages.filter(m => m.chatId === key);
            chatBox.innerHTML = msgs.map(m => `<div class="msg-wrap ${m.sender === currentUser.email ? 'mine' : 'theirs'}">${m.sender !== currentUser.email ? `<span class="text-[9px] font-bold text-slate-500 mb-1">${ALLOWED_USERS[m.sender]?.name || 'User'}</span>` : ''}<div class="bubble">${m.text}</div><div class="msg-info"><span>${m.time}</span></div></div>`).join('');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        window.addNewUser = async () => {
            const pre = document.getElementById('newEmailPrefix').value.trim().toLowerCase();
            const email = `${pre}@leverngear.com`;
            const updated = { ...ALLOWED_USERS, [email]: { name: pre.replace('.',' '), role: 'user', color: 'from-slate-500 to-slate-700', short: pre.slice(0,2).toUpperCase() } };
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'appSettings', 'usersList'), { users: updated });
            document.getElementById('newEmailPrefix').value = '';
        };

        window.toggleGroupMember = async (email, add) => {
            let n = add ? [...groupMembers, email] : groupMembers.filter(e => e !== email);
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'groupSettings', 'members'), { emails: n });
        };

        function renderAdminPanel() {
            document.getElementById('adminUsersList').innerHTML = Object.keys(ALLOWED_USERS).filter(e => e !== 'gemini@workspace.ai').map(email => `<div class="flex items-center gap-2 bg-white/5 p-2 rounded"><div class="text-[10px] font-bold text-white">${ALLOWED_USERS[email].name}</div></div>`).join('');
        }

        function renderGroupPanel() {
            document.getElementById('groupMembersList').innerHTML = Object.keys(ALLOWED_USERS).filter(e => e !== 'gemini@workspace.ai').map(email => {
                const inG = groupMembers.includes(email);
                return `<div class="flex justify-between items-center bg-white/5 p-2 rounded"><div class="text-[10px] text-white">${ALLOWED_USERS[email].name}</div>${currentUser.role === 'admin' && email !== currentUser.email ? `<button onclick="toggleGroupMember('${email}', ${!inG})" class="text-[8px] ${inG ? 'text-rose-400' : 'text-emerald-400'}">${inG ? 'Kick' : 'Add'}</button>` : ''}</div>`;
            }).join('');
        }

        checkLocalAuth();
    </script>
</body>
</html>
