<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pranto's Workspace - Escrow & Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        body { background-color: #f1f5f9; }
        
        .compact-cell {
            padding: 2px 6px;
            white-space: nowrap;
            width: 0;
            border-right: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .filter-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: white;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            border-radius: 6px;
            z-index: 50;
            min-width: 160px;
            max-height: 280px;
            flex-direction: column;
        }
        .filter-dropdown.active { display: flex; }
        
        .row-checkbox { width: 14px; height: 14px; cursor: pointer; accent-color: #10b981; }

        .glass-loader {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        /* Summary Tooltip */
        .summary-tooltip:hover .summary-content {
            display: block;
        }
    </style>
</head>
<body class="text-gray-800 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Premium Header -->
    <header class="bg-gradient-to-r from-blue-700 via-blue-600 to-indigo-700 text-white px-5 py-2 flex items-center justify-between shadow-md z-20 shrink-0">
        <div class="flex items-center gap-4">
            <a href="index.html" class="bg-white/10 hover:bg-white/20 transition p-1.5 rounded-lg text-white shadow-sm border border-white/10" title="Home">
                <i class="fa-solid fa-house"></i>
            </a>
            <div class="flex items-center gap-2 border-l border-white/20 pl-4">
                <div class="bg-white/20 p-1.5 rounded-lg shadow-inner"><i class="fa-solid fa-layer-group text-white text-sm"></i></div>
                <h1 class="text-lg font-bold tracking-wide text-white">Pranto's <span class="font-light text-blue-100">Workspace</span></h1>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="w-8 h-8 rounded-full bg-white/20 border-2 border-white/50 flex items-center justify-center cursor-pointer hover:bg-white/30 transition shadow-sm">
                <i class="fa-solid fa-user text-xs text-white"></i>
            </div>
        </div>
    </header>

    <main class="flex-1 p-2 flex flex-col gap-2 overflow-hidden h-full w-full">
        <!-- Top Toolbar -->
        <div class="bg-white rounded-xl p-2 shadow-sm border border-gray-200 flex flex-wrap items-center justify-between gap-2 shrink-0">
            
            <!-- Upload Section -->
            <div class="flex items-center gap-2 pr-2 border-r border-gray-200">
                <div id="escrowContainer" class="flex flex-col gap-0.5 p-1 bg-red-50 border border-red-200 rounded-lg transition-colors w-40">
                    <div class="text-[9px] font-bold text-gray-500 uppercase tracking-wider pl-1"><i class="fa-solid fa-file-excel text-red-400"></i> 1. Escrow</div>
                    <div class="flex items-center gap-1">
                        <input type="file" id="escrowFile" accept=".xlsx, .xls, .csv" class="hidden" onchange="fileSelected('escrow')">
                        <button onclick="document.getElementById('escrowFile').click()" id="escrowBtnText" class="flex-1 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-2 py-0.5 rounded text-[10px] font-medium truncate shadow-sm">Select File</button>
                        <button onclick="loadEscrow()" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-0.5 rounded text-[10px] font-bold shadow-sm transition"><i class="fa-solid fa-cloud-arrow-up"></i></button>
                    </div>
                </div>

                <div id="trackingContainer" class="flex flex-col gap-0.5 p-1 bg-red-50 border border-red-200 rounded-lg transition-colors w-40">
                    <div class="text-[9px] font-bold text-gray-500 uppercase tracking-wider pl-1"><i class="fa-solid fa-file-excel text-red-400"></i> 2. Tracking</div>
                    <div class="flex items-center gap-1">
                        <input type="file" id="trackingFile" accept=".xlsx, .xls, .csv" class="hidden" onchange="fileSelected('tracking')">
                        <button onclick="document.getElementById('trackingFile').click()" id="trackingBtnText" class="flex-1 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-2 py-0.5 rounded text-[10px] font-medium truncate shadow-sm">Select File</button>
                        <button onclick="loadTracking()" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-0.5 rounded text-[10px] font-bold shadow-sm transition"><i class="fa-solid fa-cloud-arrow-up"></i></button>
                    </div>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-2 flex-1">
                
                <!-- Counters & View Toggle -->
                <div class="flex flex-col gap-1 mr-1">
                    <div class="flex gap-1 text-[10px] font-bold">
                        <div class="bg-green-50 text-green-700 px-1.5 py-0.5 rounded border border-green-200 shadow-sm flex items-center justify-between w-20">
                            Pay: <span id="countPayment" class="bg-green-200 px-1 rounded-sm">0</span>
                        </div>
                        <div class="bg-purple-50 text-purple-700 px-1.5 py-0.5 rounded border border-purple-200 shadow-sm flex items-center justify-between w-20">
                            Ref: <span id="countRefund" class="bg-purple-200 px-1 rounded-sm">0</span>
                        </div>
                    </div>
                    <button onclick="toggleMiniView()" id="miniViewBtn" class="w-full flex items-center justify-center gap-1 py-0.5 bg-indigo-50 text-indigo-700 rounded border border-indigo-200 text-[10px] font-bold hover:bg-indigo-100 transition shadow-sm">
                        <i class="fa-solid fa-compress"></i> Mini View
                    </button>
                </div>

                <div class="w-px h-8 bg-gray-200 mx-0.5"></div>

                <!-- Filters -->
                <div class="flex flex-col gap-1">
                    <div class="flex gap-1">
                        <select id="tabFilter" onchange="triggerFilterWithLoader()" class="w-24 px-1 py-0.5 bg-blue-50 text-blue-700 border border-blue-200 rounded text-[10px] font-bold outline-none cursor-pointer shadow-sm">
                            <option value="">ALL TABS</option>
                        </select>
                        <select id="typeFilter" onchange="triggerFilterWithLoader()" class="w-24 px-1 py-0.5 bg-blue-50 text-blue-700 border border-blue-200 rounded text-[10px] font-bold outline-none cursor-pointer shadow-sm">
                            <option value="">ALL TYPES</option>
                            <option value="payment">PAYMENTS</option>
                            <option value="refund">REFUNDS</option>
                        </select>
                    </div>
                    <div class="flex gap-1">
                        <select id="processFilter" onchange="triggerFilterWithLoader()" class="w-24 px-1 py-0.5 bg-slate-100 text-slate-700 border border-slate-300 rounded text-[10px] font-bold outline-none cursor-pointer shadow-sm">
                            <option value="">MARK: ALL</option>
                            <option value="done">MARK: DONE</option>
                            <option value="pending">MARK: PENDING</option>
                        </select>
                        <!-- NEW: Color/Error Filter -->
                        <select id="colorFilter" onchange="triggerFilterWithLoader()" class="w-24 px-1 py-0.5 bg-rose-50 text-rose-700 border border-rose-300 rounded text-[10px] font-bold outline-none cursor-pointer shadow-sm">
                            <option value="">COLOR: ALL</option>
                            <option value="error_all">ALL ERRORS</option>
                            <option value="error_dispute">MISSING DISP.</option>
                            <option value="error_amount">AMT MISMATCH</option>
                            <option value="error_date">DATE/PENDING</option>
                        </select>
                    </div>
                </div>

                <!-- Search & Serial -->
                <div class="flex flex-col gap-1">
                    <div class="flex items-center shadow-sm">
                        <div class="relative w-32">
                            <i class="fa-solid fa-search text-gray-400 absolute left-1.5 top-1/2 -translate-y-1/2 text-[10px]"></i>
                            <input type="text" id="globalSearch" placeholder="Search..." class="w-full pl-5 pr-1 py-0.5 bg-gray-50 border border-gray-200 rounded-l text-[10px] outline-none" onkeypress="if(event.key === 'Enter') triggerFilterWithLoader()">
                        </div>
                        <button onclick="triggerFilterWithLoader()" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-2 py-0.5 border-y border-r border-blue-200 rounded-r text-[10px] transition"><i class="fa-solid fa-play"></i></button>
                    </div>
                    <div class="flex items-center shadow-sm">
                        <div class="relative w-32">
                            <span class="absolute left-1.5 top-1/2 -translate-y-1/2 text-[9px] font-bold text-gray-500">Serial:</span>
                            <input type="text" id="startSerial" class="w-full pl-8 pr-1 py-0.5 bg-gray-50 border border-gray-200 rounded-l text-[10px] outline-none" onkeypress="if(event.key === 'Enter') triggerFilterWithLoader()">
                        </div>
                        <button onclick="triggerFilterWithLoader()" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-2 py-0.5 border-y border-r border-blue-200 rounded-r text-[10px] transition"><i class="fa-solid fa-play"></i></button>
                    </div>
                </div>

                <div class="flex-1"></div>

                <!-- Actions -->
                <div class="flex flex-col gap-1 border-r border-gray-200 pr-2 mr-1">
                    <select id="copyType" class="w-28 px-1 py-0.5 bg-emerald-50 text-emerald-800 border border-emerald-300 rounded text-[10px] font-bold outline-none cursor-pointer shadow-sm">
                        <option value="dispute">Copy Disputes</option>
                        <option value="all">Copy All Data</option>
                    </select>
                    <button onclick="handleCopy()" id="copyBtn" class="flex items-center justify-center gap-1 py-0.5 bg-emerald-600 text-white rounded text-[10px] font-bold hover:bg-emerald-700 border border-emerald-700 transition shadow-sm">
                        <i class="fa-solid fa-copy"></i> Copy
                    </button>
                </div>
                
                <div class="flex flex-col gap-1 border-r border-gray-200 pr-2 mr-1 relative summary-tooltip">
                    <button class="flex items-center justify-center gap-1 px-2 py-0.5 bg-cyan-50 text-cyan-700 rounded border border-cyan-300 text-[10px] font-bold shadow-sm h-full w-24">
                        <i class="fa-solid fa-chart-pie"></i> Summary
                    </button>
                    <!-- Tooltip Content -->
                    <div class="summary-content hidden absolute top-full right-0 mt-1 w-56 bg-white border border-gray-200 shadow-xl rounded-lg z-50 p-3 text-xs">
                        <h4 class="font-bold border-b pb-1 mb-2 text-gray-700">Serial Data Summary</h4>
                        <div class="flex justify-between font-bold text-gray-600 mb-2">
                            <span>Total Records:</span> <span id="sumTotal" class="text-blue-600">0</span>
                        </div>
                        <div class="flex justify-between font-bold text-green-600 mb-1">
                            <span>Total Payments:</span> <span id="sumPay">0</span>
                        </div>
                        <div class="flex justify-between font-bold text-purple-600 mb-3 border-b pb-2">
                            <span>Total Refunds:</span> <span id="sumRef">0</span>
                        </div>
                        <h5 class="font-bold text-gray-500 text-[10px] mb-1">BY TAB:</h5>
                        <div id="sumTabs" class="flex flex-col gap-1 max-h-32 overflow-y-auto">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-1">
                    <button onclick="clearAllFilters()" class="flex items-center justify-center gap-1 px-2 py-0.5 bg-yellow-50 text-yellow-700 rounded border border-yellow-300 text-[10px] font-bold hover:bg-yellow-100 transition shadow-sm">
                        <i class="fa-solid fa-filter-circle-xmark"></i> Reset
                    </button>
                    <button onclick="clearWorkspace()" class="flex items-center justify-center gap-1 px-2 py-0.5 bg-red-50 text-red-600 rounded border border-red-200 text-[10px] font-bold hover:bg-red-100 transition shadow-sm">
                        <i class="fa-solid fa-trash-can"></i> Clear
                    </button>
                </div>
            </div>
        </div>

        <!-- Data Table Area -->
        <div class="bg-white rounded-xl shadow-md border border-gray-200 flex flex-col flex-1 overflow-hidden relative">
            <div class="px-3 py-1 border-b border-gray-700 flex justify-between items-center bg-gray-800 text-white shrink-0">
                <div class="flex items-center gap-3">
                    <h3 class="font-bold text-[11px] tracking-wide">Statement Data</h3>
                    <div class="flex items-center gap-2 text-[9px] font-medium bg-gray-900/50 px-2 py-0.5 rounded border border-gray-700">
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-red-200 border border-red-500 inline-block"></span> Error / Mismatch</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-300 border border-green-600 inline-block"></span> Done</span>
                    </div>
                </div>
                <div class="text-[10px] bg-gray-700 px-2 py-0.5 rounded shadow-inner font-bold border border-gray-600" id="recordCount">
                    Showing 0 records
                </div>
            </div>
            
            <div class="flex-1 overflow-auto relative bg-slate-50" id="tableContainer">
                <!-- Premium Loader -->
                <div id="loadingOverlay" class="absolute inset-0 glass-loader z-[100] hidden flex-col items-center justify-center">
                    <div class="bg-white px-6 py-4 rounded-xl shadow-2xl flex flex-col items-center border border-gray-100">
                        <div class="relative w-10 h-10 mb-2">
                            <div class="absolute inset-0 rounded-full border-[3px] border-blue-100"></div>
                            <div class="absolute inset-0 rounded-full border-[3px] border-blue-600 border-t-transparent animate-spin"></div>
                        </div>
                        <span class="text-blue-900 font-bold text-[10px] uppercase tracking-widest animate-pulse">Processing...</span>
                    </div>
                </div>

                <table class="w-max text-left border-collapse bg-white" id="dataTable">
                    <thead class="sticky top-0 bg-gray-900 shadow-md z-10" id="tableHead"></thead>
                    <tbody class="text-[11px] text-gray-800" id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let allData = [];
        let filteredData = [];
        let baseHeaders = [];
        let activeHeaders = []; 
        let hiddenColumns = new Set();
        let columnFilters = {};
        
        let processedRows = new Set(); 

        let trackingMapA = {}; 
        let trackingMapB = {}; 
        let trackingLoaded = false;
        let escrowLoaded = false;
        
        let isMiniView = false; 

        // Stores logic errors for the color filter
        let rowErrors = {}; 

        function showLoader(callback) {
            document.getElementById('loadingOverlay').classList.remove('hidden');
            document.getElementById('loadingOverlay').classList.add('flex');
            setTimeout(() => { callback(); }, 50); 
        }

        function hideLoader() {
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('loadingOverlay').classList.remove('flex');
        }

        function triggerFilterWithLoader() {
            if(!escrowLoaded) return;
            showLoader(() => {
                applyFilters();
                setTimeout(hideLoader, 50);
            });
        }

        const REQUIRED_COLS = [
            "Document_Type", "Posting_Date", "Project", "Dispute", "Reconciled", 
            "Liability", "Escrow_Amount", "Admin_Amount", "Service_Hold_Amount", 
            "Service_Amount", "Case_Outcome"
        ];
        
        const MINI_VIEW_COLS = [
            "Document_Type", "Dispute", "Reconciled", "Liability", "Escrow_Amount", 
            "Tracking_Status", "Tracking_Col_C", "Tracking_Ticket",
            "Tracking_Col_L", "Tracking_Col_M", "Tracking_Col_R", 
            "Tracking_Col_T", "Tracking_Col_U", "Tracking_Col_X", "Tracking_Col_Y"
        ];

        function normalizeDispute(d) {
            if(!d) return '';
            return String(d).replace(/[^A-Z0-9]/ig, '').toUpperCase();
        }

        function formatExcelDate(val) {
            if (!val) return '';
            if (val instanceof Date) {
                let m = (val.getMonth()+1).toString().padStart(2, '0');
                let d = val.getDate().toString().padStart(2, '0');
                return `${m}/${d}/${val.getFullYear()}`;
            }
            if (typeof val === 'number' && val > 10000) {
                let date = new Date((val - 25569) * 86400 * 1000);
                let m = (date.getMonth()+1).toString().padStart(2, '0');
                let d = date.getDate().toString().padStart(2, '0');
                return `${m}/${d}/${date.getFullYear()}`;
            }
            return val;
        }

        function fileSelected(type) {
            const input = document.getElementById(type + 'File');
            const btn = document.getElementById(type + 'BtnText');
            if(input.files.length > 0) {
                let name = input.files[0].name;
                if(name.length > 15) name = name.substring(0, 12) + '...';
                btn.textContent = name;
                btn.classList.add('bg-blue-50', 'text-blue-700', 'border-blue-200');
            }
        }

        function loadEscrow() {
            const file = document.getElementById('escrowFile').files[0];
            if (!file) return alert("Please select an Escrow Statement file first.");

            showLoader(() => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                        
                        let targetSheetName = workbook.SheetNames[0];
                        for (let i = 0; i < workbook.SheetNames.length; i++) {
                            if (workbook.SheetNames[i].toLowerCase() === 'data') {
                                targetSheetName = workbook.SheetNames[i];
                                break;
                            }
                        }
                        const worksheet = workbook.Sheets[targetSheetName];
                        let range = XLSX.utils.decode_range(worksheet['!ref'] || "A1:A1");
                        range.e.r = Math.max(range.e.r, 50000);
                        range.e.c = Math.max(range.e.c, 40);
                        worksheet['!ref'] = XLSX.utils.encode_range(range);

                        const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "", blankrows: true });
                        
                        let headerIndex = -1;
                        let rawHeaders = [];
                        for (let i = 0; i < rawRows.length; i++) {
                            const row = rawRows[i];
                            if (row.filter(cell => String(cell).trim() !== '').length > 5) {
                                headerIndex = i;
                                rawHeaders = row.map(h => String(h).trim());
                                break;
                            }
                        }

                        if (headerIndex === -1) {
                            hideLoader();
                            return alert('Header not found in Escrow File');
                        }

                        let headerMap = {};
                        REQUIRED_COLS.forEach(req => {
                            let normalizedReq = req.toLowerCase().replace(/_/g, '');
                            let foundExcelHeader = rawHeaders.find(h => {
                                let normalizedH = h.toLowerCase().replace(/[^a-z0-9]/g, '');
                                if (normalizedReq === 'liability' && (normalizedH === 'liability' || normalizedH === 'liab')) return true;
                                if (normalizedReq === 'escrowamount' && (normalizedH === 'escrowamount' || normalizedH === 'escrow')) return true;
                                if (normalizedReq === 'adminamount' && normalizedH === 'adminamount') return true;
                                if (normalizedReq === 'serviceholdamount' && (normalizedH === 'serviceholdamount' || normalizedH.includes('holdam'))) return true;
                                if (normalizedReq === 'serviceamount' && normalizedH === 'serviceamount') return true;
                                
                                return normalizedH === normalizedReq;
                            });
                            if(foundExcelHeader) headerMap[req] = foundExcelHeader;
                        });

                        baseHeaders = REQUIRED_COLS.filter(req => headerMap[req]);
                        allData = [];

                        for (let i = headerIndex + 1; i < rawRows.length; i++) {
                            const row = rawRows[i];
                            if (row.every(cell => String(cell).trim() === '')) continue;

                            let obj = { _excel_row_num: i + 1, _gl_entry: '' };
                            let glIndex = rawHeaders.findIndex(h => h.toLowerCase().includes('gl_entry'));
                            if(glIndex > -1) obj._gl_entry = String(row[glIndex]);

                            baseHeaders.forEach(h => {
                                let excelColName = headerMap[h];
                                let colIndex = rawHeaders.indexOf(excelColName);
                                let val = row[colIndex];
                                if (val instanceof Date) val = formatExcelDate(val);
                                obj[h] = val !== undefined && val !== null ? val : '';
                            });
                            allData.push(obj);
                        }

                        escrowLoaded = true;
                        processedRows.clear(); 
                        document.getElementById('escrowContainer').className = "flex flex-col gap-0.5 p-1 bg-green-50 border border-green-400 rounded-lg transition-colors w-40";
                        
                        updateActiveHeadersAndFilters();
                        applyFilters();
                        hideLoader();

                    } catch (error) {
                        console.error(error);
                        hideLoader();
                        alert('Error loading Escrow file');
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function loadTracking() {
            const file = document.getElementById('trackingFile').files[0];
            if (!file) return alert("Please select a Tracking Sheet file first.");
            if (!escrowLoaded) return alert("Please load Escrow Statement first.");

            showLoader(() => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array', cellDates: true }); 
                        
                        trackingMapA = {}; 
                        trackingMapB = {};

                        workbook.SheetNames.forEach(sheetName => {
                            const sheet = workbook.Sheets[sheetName];
                            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", raw: false });
                            
                            let formattedSheetName = sheetName.replace(/COMPLETED/ig, 'C').trim();

                            rows.forEach(row => {
                                let cellA = String(row[0] || '').trim(); 
                                if(cellA.toUpperCase().includes('DISP-')) {
                                    let normDisp = normalizeDispute(cellA);
                                    trackingMapA[normDisp] = {
                                        tab: formattedSheetName,
                                        colC: String(row[2] || '').trim(), 
                                        colL: row[11], 
                                        colM: row[12], 
                                        colR: formatExcelDate(row[17]), 
                                        colT: formatExcelDate(row[19]), 
                                        colU: String(row[20] || '').trim(), 
                                        colX: row[23], 
                                        colY: formatExcelDate(row[24])  
                                    };
                                }

                                let cellB = String(row[1] || '').trim();
                                if(cellB.toUpperCase().includes('DISP-')) {
                                    let normDispB = normalizeDispute(cellB);
                                    let ticketVal = String(row[3] || '').trim(); 
                                    if(ticketVal) {
                                        if(!trackingMapB[normDispB]) trackingMapB[normDispB] = new Set();
                                        trackingMapB[normDispB].add(ticketVal);
                                    }
                                }
                            });
                        });

                        trackingLoaded = true;
                        document.getElementById('trackingContainer').className = "flex flex-col gap-0.5 p-1 bg-green-50 border border-green-400 rounded-lg transition-colors w-40";
                        
                        allData.forEach(row => {
                            let disp = normalizeDispute(row['Dispute']);
                            let mapA = trackingMapA[disp];
                            let mapB = trackingMapB[disp];
                            
                            row['Tracking_Status'] = mapA ? mapA.tab : (!row['Dispute'] ? 'NO DISPUTE ID' : 'NOT FOUND');
                            row['Tracking_Col_C'] = mapA ? mapA.colC : '';
                            row['Tracking_Ticket'] = mapB ? Array.from(mapB).join('<br>') : '';
                            
                            row['Tracking_Col_L'] = mapA ? mapA.colL : '';
                            row['Tracking_Col_M'] = mapA ? mapA.colM : '';
                            row['Tracking_Col_R'] = mapA ? mapA.colR : '';
                            row['Tracking_Col_T'] = mapA ? mapA.colT : '';
                            row['Tracking_Col_U'] = mapA ? mapA.colU : '';
                            row['Tracking_Col_X'] = mapA ? mapA.colX : '';
                            row['Tracking_Col_Y'] = mapA ? mapA.colY : '';
                        });

                        updateActiveHeadersAndFilters();
                        
                        if(isMiniView) {
                            hiddenColumns.clear();
                            activeHeaders.forEach(h => {
                                if (!MINI_VIEW_COLS.includes(h)) hiddenColumns.add(h);
                            });
                        }

                        applyFilters();
                        hideLoader();

                    } catch (error) {
                        console.error(error);
                        hideLoader();
                        alert('Error loading Tracking file');
                    }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function updateActiveHeadersAndFilters() {
            activeHeaders = [...baseHeaders];
            if(trackingLoaded) {
                activeHeaders.push("Tracking_Status", "Tracking_Col_C", "Tracking_Ticket", "Tracking_Col_L", "Tracking_Col_M", "Tracking_Col_R", "Tracking_Col_T", "Tracking_Col_U", "Tracking_Col_X", "Tracking_Col_Y"); 
            }
            
            activeHeaders.forEach(h => {
                let uniques = [...new Set(allData.map(r => String(r[h])))];
                if (!columnFilters[h]) columnFilters[h] = new Set(uniques);
            });

            if(trackingLoaded) {
                let uniqueTabs = [...new Set(allData.map(r => String(r['Tracking_Status'] || '')))].filter(t => t !== 'NOT FOUND' && t !== 'NO DISPUTE ID').sort();
                let tabSelect = document.getElementById('tabFilter');
                tabSelect.innerHTML = '<option value="">ALL TABS</option>';
                
                let baseTabs = [...new Set(uniqueTabs.map(t => t.replace(/\s+C$/i, '').trim()))];
                baseTabs.forEach(t => {
                    tabSelect.innerHTML += `<option value="${t.toLowerCase()}">${t}</option>`;

        }

        function toggleMiniView() {

            let btn = document.getElementById('miniViewBtn');
            
            showLoader(() => {
                if (isMiniView) {
                    btn.innerHTML = `<i class="fa-solid fa-expand text-sm"></i> Full View`;

                    btn.classList.replace('text-indigo-700', 'text-white');
                    
                    hiddenColumns.clear();

                    });
                } else {

                    hiddenColumns.clear();
                }
                renderTable();
                setTimeout(hideLoader, 50);
            });

        function toggleColumn(col) {
            if (hiddenColumns.has(col)) hiddenColumns.delete(col);
            else hiddenColumns.add(col);
            renderTable();
        }

        function toggleDropdown(headerId) {
            document.querySelectorAll('.filter-dropdown').forEach(d => {
                if(d.id !== `dropdown-${headerId}`) d.classList.remove('active');
            });
            const dropdown = document.getElementById(`dropdown-${headerId}`);
            if(dropdown) dropdown.classList.toggle('active');
        }

        function sortData(col, dir) {
            showLoader(() => {
                filteredData.sort((a, b) => {
                    let valA = a[col] || '';
                    let valB = b[col] || '';
                    if(typeof valA === 'string') valA = valA.toLowerCase();
                    if(typeof valB === 'string') valB = valB.toLowerCase();
                    if(valA < valB) return dir === 'asc' ? -1 : 1;
                    if(valA > valB) return dir === 'asc' ? 1 : -1;
                    return 0;
                });
                renderTable();
                setTimeout(hideLoader, 50);
            });
        }

        function toggleSelectAll(col, isChecked) {
            if (isChecked) {
                let uniques = [...new Set(allData.map(r => String(r[col])))];
                columnFilters[col] = new Set(uniques);
            } else {
                columnFilters[col].clear();
            }
            triggerFilterWithLoader();
        }

        function updateColumnFilter(col, val, isChecked) {
            if(isChecked) columnFilters[col].add(String(val));
            else columnFilters[col].delete(String(val));
            triggerFilterWithLoader(); 
        }

        function toggleRow(rowNumStr, isChecked) {
            let rowNum = parseInt(rowNumStr);
            if (isChecked) processedRows.add(rowNum);
            else processedRows.delete(rowNum);
            renderTable(); 
        }

        function toggleAllVisible(isChecked) {
            showLoader(() => {
                filteredData.forEach(row => {
                    if (isChecked) processedRows.add(row._excel_row_num);
                    else processedRows.delete(row._excel_row_num);
                });
                renderTable();
                setTimeout(hideLoader, 50);
            });
        }

        // --- PRE-CALCULATE ERRORS FOR COLOR FILTER ---
        function checkLogicErrors(row) {
            let errors = { hasAny: false, missing: false, amount: false, date: false };
            
            let rawDispute = row['Dispute'];
            if (!rawDispute || String(rawDispute).trim() === '') { errors.missing = true; errors.hasAny = true; }
            else if (trackingLoaded && row['Tracking_Status'] === 'NOT FOUND') { errors.missing = true; errors.hasAny = true; }

            let docType = String(row['Document_Type'] || '').toLowerCase();
            let isPayment = docType.includes('payment');
            let isRefund = docType.includes('refund');

            // Date / Pending Error
            let isReconciled = String(row['Reconciled']).toUpperCase() === 'TRUE' || row['Reconciled'] === true || row['Reconciled'] === 1;
            if (isReconciled && String(row['Tracking_Col_U']).toUpperCase() === 'PENDING') { errors.date = true; errors.hasAny = true; }
            if (isPayment && (!row['Tracking_Col_R'] || String(row['Tracking_Col_R']).trim() === '')) { errors.date = true; errors.hasAny = true; }
            if (isRefund && (!row['Tracking_Col_Y'] || String(row['Tracking_Col_Y']).trim() === '')) { errors.date = true; errors.hasAny = true; }

            // Amount Mismatch
            if (isPayment) {
                let liability = Math.abs(parseFloat(row['Liability']) || 0); 
                let adminFee = parseFloat(row['Tracking_Col_L']) || 0;
                let procFee = parseFloat(row['Tracking_Col_M']) || 0;
                if (Math.abs(liability - (adminFee + procFee)) > 0.01) { errors.amount = true; errors.hasAny = true; }
            }
            if (isRefund) {
                let escrowAmt = Math.abs(parseFloat(row['Escrow_Amount']) || 0);
                let medFeeRefund = parseFloat(row['Tracking_Col_X']) || 0;
                if (Math.abs(escrowAmt - medFeeRefund) > 0.01) { errors.amount = true; errors.hasAny = true; }
            }
            
            return errors;
        }

        function applyFilters() {
            if (!escrowLoaded) return;

            const globalTerm = document.getElementById('globalSearch').value.toLowerCase();
            const serialTerm = document.getElementById('startSerial').value.toLowerCase();
            const tabTerm = document.getElementById('tabFilter').value.toLowerCase();
            const typeTerm = document.getElementById('typeFilter').value.toLowerCase();
            const statusTerm = document.getElementById('processFilter').value;
            const colorTerm = document.getElementById('colorFilter').value;

            rowErrors = {}; 
            let baseData = [...allData];
            
            // Serial Logic: Get all data AFTER serial
            if (serialTerm) {
                let startIndex = baseData.findIndex(row => 
                    String(row._excel_row_num) === serialTerm || String(row._gl_entry).toLowerCase() === serialTerm
                );
                if (startIndex > -1) baseData = baseData.slice(startIndex);
            }
            
            // Build Summary Data based ONLY on Serial Cutoff (ignores other filters)
            buildSummaryStats(baseData);

            filteredData = baseData.filter(row => {
                let errs = checkLogicErrors(row);
                rowErrors[row._excel_row_num] = errs;

                // Color Filter
                if (colorTerm === 'error_all' && !errs.hasAny) return false;
                if (colorTerm === 'error_dispute' && !errs.missing) return false;
                if (colorTerm === 'error_amount' && !errs.amount) return false;
                if (colorTerm === 'error_date' && !errs.date) return false;

                if (tabTerm && !String(row['Tracking_Status'] || '').toLowerCase().startsWith(tabTerm)) return false;
                if (typeTerm && !String(row['Document_Type'] || '').toLowerCase().includes(typeTerm)) return false;

                if (statusTerm === 'done' && !processedRows.has(row._excel_row_num)) return false;
                if (statusTerm === 'pending' && processedRows.has(row._excel_row_num)) return false;

                let passesCheckbox = true;
                for (let col of activeHeaders) {
                    if (columnFilters[col]) {
                        if (!columnFilters[col].has(String(row[col]))) {
                            passesCheckbox = false;
                            break;
                        }
                    }
                }
                if (!passesCheckbox) return false;

                if (globalTerm) {
                    const rowText = Object.values(row).join(' ').toLowerCase();
                    if (!rowText.includes(globalTerm)) return false;
                }

                return true;
            });

            renderTable();
        }

        // Summary Statistics based on Serial baseData
        function buildSummaryStats(serialData) {
            let total = serialData.length;
            let pay = 0, ref = 0;
            let tabStats = {};

            serialData.forEach(row => {
                let type = String(row['Document_Type'] || '').toLowerCase();
                let tab = String(row['Tracking_Status'] || 'NO DISPUTE').trim();
                let baseTab = tab.replace(/\s+C$/i, '').trim(); 
                if(!tabStats[baseTab]) tabStats[baseTab] = { pay: 0, ref: 0 };

                if (type.includes('payment')) { pay++; tabStats[baseTab].pay++; }
                if (type.includes('refund')) { ref++; tabStats[baseTab].ref++; }
            });

            document.getElementById('sumTotal').textContent = total;
            document.getElementById('sumPay').textContent = pay;
            document.getElementById('sumRef').textContent = ref;

            let html = '';
            for(let t in tabStats) {
                if(t !== 'NOT FOUND' && t !== 'NO DISPUTE') {
                    html += `
                    <div class="flex flex-col bg-gray-50 p-1 rounded border border-gray-100 mb-1">
                        <div class="font-bold text-gray-700">${t}</div>
                        <div class="flex justify-between text-[9px]">
                            <span class="text-green-600">Pay: ${tabStats[t].pay}</span>
                            <span class="text-purple-600">Ref: ${tabStats[t].ref}</span>
                        </div>
                    </div>`;
                }
            }
            document.getElementById('sumTabs').innerHTML = html;
        }

        function clearAllFilters() {
            showLoader(() => {
                document.getElementById('globalSearch').value = '';
                document.getElementById('startSerial').value = '';
                document.getElementById('tabFilter').value = '';
                document.getElementById('typeFilter').value = '';
                document.getElementById('processFilter').value = '';
                document.getElementById('colorFilter').value = '';
                
                activeHeaders.forEach(h => {
                    let uniques = [...new Set(allData.map(r => String(r[h])))];
                    columnFilters[h] = new Set(uniques);
                });
                applyFilters();
                setTimeout(hideLoader, 50);
            });
        }

        function updateCounters() {
            // Check if a tab is specifically selected in dropdown. 
            // If so, use FIXED summary stats for that tab so it doesn't change when checking boxes
            const tabTerm = document.getElementById('tabFilter').value;
            let payDisplay = 0;
            let refDisplay = 0;

            if (tabTerm) {
                // Find fixed counts for this tab from our full data (post-serial)
                const serialTerm = document.getElementById('startSerial').value.toLowerCase();
                let baseData = [...allData];
                if (serialTerm) {
                    let startIndex = baseData.findIndex(row => String(row._excel_row_num) === serialTerm || String(row._gl_entry).toLowerCase() === serialTerm);
                    if (startIndex > -1) baseData = baseData.slice(startIndex);
                }
                
                baseData.forEach(row => {
                    let tStatus = String(row['Tracking_Status'] || '').toLowerCase();
                    if (tStatus.startsWith(tabTerm)) {
                        let docType = String(row['Document_Type'] || '').toLowerCase();
                        if (docType.includes('payment')) payDisplay++;
                        if (docType.includes('refund')) refDisplay++;
                    }
                });
            } else {
                // No tab selected, use filtered data live count
                filteredData.forEach(row => {
                    const typeVal = String(row['Document_Type'] || '').toLowerCase();
                    if (typeVal.includes('payment')) payDisplay++;
                    if (typeVal.includes('refund')) refDisplay++;
                });
            }

            document.getElementById('countPayment').textContent = payDisplay;
            document.getElementById('countRefund').textContent = refDisplay;
        }

        function handleCopy() {
            if (filteredData.length === 0) return alert('No data to copy!');
            
            showLoader(() => {
                setTimeout(() => {
                    const copyType = document.getElementById('copyType').value;
                    let textToCopy = '';
                    
                    if (copyType === 'dispute') {
                        let disputes = filteredData.map(row => String(row['Dispute'] || '').trim()).filter(d => d !== '');
                        textToCopy = [...new Set(disputes)].join('\n');
                        
                        const tempTextArea = document.createElement("textarea");
                        tempTextArea.value = textToCopy;
                        document.body.appendChild(tempTextArea);
                        tempTextArea.select();
                        executeCopy(tempTextArea);
                        document.body.removeChild(tempTextArea);
                        
                    } else {
                        const tableClone = document.getElementById('dataTable').cloneNode(true);
                        
                        const cells = tableClone.querySelectorAll('th, td');
                        cells.forEach(cell => {
                            let bg = '', color = '';
                            if (cell.classList.contains('bg-red-50') || cell.classList.contains('bg-red-100')) bg = '#fee2e2';
                            if (cell.classList.contains('bg-green-100')) bg = '#dcfce7';
                            if (cell.classList.contains('bg-green-200')) bg = '#bbf7d0'; 
                            if (cell.classList.contains('bg-gray-100')) bg = '#f3f4f6';
                            if (cell.classList.contains('bg-gray-900')) bg = '#111827';
                            
                            if (cell.classList.contains('text-red-900') || cell.classList.contains('text-red-800') || cell.classList.contains('text-red-600')) color = '#991b1b';
                            if (cell.classList.contains('text-green-900') || cell.classList.contains('text-green-700')) color = '#14532d';
                            if (cell.classList.contains('text-white') || cell.classList.contains('text-yellow-300')) color = '#ffffff';

                            const removals = cell.querySelectorAll('i, button, .filter-dropdown, input[type="checkbox"]');
                            removals.forEach(r => r.remove());

                            if (bg) cell.style.backgroundColor = bg;
                            if (color) cell.style.color = color;
                            cell.style.border = '1px solid #d1d5db';
                            cell.innerHTML = cell.innerHTML.replace(/<br\s*[\/]?>/gi, '<br style="mso-data-placement:same-cell;" />');
                        });

                        tableClone.querySelectorAll('tr').forEach(tr => {
                            if(tr.children.length > 0) tr.removeChild(tr.children[0]);
                        });

                        const tempDiv = document.createElement('div');
                        tempDiv.appendChild(tableClone);
                        document.body.appendChild(tempDiv);

                        const selection = window.getSelection();
                        const range = document.createRange();
                        range.selectNodeContents(tempDiv);
                        selection.removeAllRanges();
                        selection.addRange(range);

                        executeCopy();
                        
                        document.body.removeChild(tempDiv);
                        selection.removeAllRanges();
                    }
                    hideLoader();
                }, 50); 
            });
        }

        function executeCopy() {
            try {
                document.execCommand('copy');
                let btn = document.getElementById('copyBtn');
                let originalHTML = btn.innerHTML;
                btn.innerHTML = `<i class="fa-solid fa-check"></i> Copied!`;
                btn.classList.replace('bg-emerald-600', 'bg-green-600');
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.classList.replace('bg-green-600', 'bg-emerald-600');
                }, 2000);
            } catch (err) {
                alert("Copy operation failed.");
            }
        }

        const trackingHeaderNames = {
            'Tracking_Status': 'TAB',
            'Tracking_Col_C': 'IDR TYPE (C)',
            'Tracking_Ticket': 'TICKET (D)',
            'Tracking_Col_L': 'ADMIN FEE (L)',
            'Tracking_Col_M': 'PROC. FEE (M)',
            'Tracking_Col_R': 'FEE REC. DATE (R)',
            'Tracking_Col_T': 'DET. DATE (T)',
            'Tracking_Col_U': 'WIN/LOSE (U)',
            'Tracking_Col_X': 'REFUND (X)',
            'Tracking_Col_Y': 'REF. DATE (Y)'
        };

        function renderTable() {

            updateCounters();

            headHTML += `<th class="px-2 py-1.5 border-r border-gray-700 text-[10px] text-white text-center w-8">ROW</th>`;

            let colIndex = 0;
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

                    alphabetRow += `<th class="px-1 py-0.5 border-r border-gray-700 bg-gray-800 w-4"></th>`;
                    colIndex++;
                    return;
                }

                let char = colIndex < 26 ? letters[colIndex] : letters[Math.floor(colIndex/26)-1] + letters[colIndex%26];
                alphabetRow += `<th class="px-1 py-0.5 border-r border-gray-700 bg-gray-800 text-gray-400 text-[9px] text-center font-normal">${char}</th>`;
                colIndex++;

                let uniqueValues = [...new Set(allData.map(r => String(r[h])))].sort();

                headHTML += `
                    <th class="px-1.5 py-1 border-r border-gray-700 text-[9px] uppercase font-bold ${trackingLoaded && h.startsWith('Tracking') ? 'text-yellow-300' : 'text-white'} whitespace-normal ${maxWidthClass} break-words relative">

                                <span class="cursor-pointer hover:text-blue-600" onclick="sortData('${h}', 'desc')"><i class="fa-solid fa-arrow-down-z-a"></i> Z-A</span>
                            </div>

                                    return `
                                    <label class="flex items-center gap-1 cursor-pointer hover:bg-gray-50 p-0.5 rounded">

                        let isReconciled = String(row['Reconciled']).toUpperCase() === 'TRUE' || row['Reconciled'] === true || row['Reconciled'] === 1;

                    if (h === 'Liability' && isPayment) {
                        let liability = Math.abs(parseFloat(row['Liability']) || 0); 
                        let adminFee = parseFloat(row['Tracking_Col_L']) || 0;
                        let procFee = parseFloat(row['Tracking_Col_M']) || 0;
                        if (Math.abs(liability - (adminFee + procFee)) > 0.01) {
                            cellBgClass = 'bg-red-100'; textStyle = 'text-red-800 font-bold';
                        }
                    }

                    if (h === 'Escrow_Amount' && isRefund) {
                        let escrowAmt = Math.abs(parseFloat(row['Escrow_Amount']) || 0);
                        let medFeeRefund = parseFloat(row['Tracking_Col_X']) || 0;
                        if (Math.abs(escrowAmt - medFeeRefund) > 0.01) {
                            cellBgClass = 'bg-red-100'; textStyle = 'text-red-800 font-bold';
                        }
                    }

                    bodyHTML += `<td class="compact-cell ${cellBgClass} ${align} ${textStyle} leading-tight">${val}</td>`;
                });
                bodyHTML += `</tr>`;
            });
            tBody.innerHTML = bodyHTML;
        }

        document.addEventListener('click', function(event) {
            if (!event.target.closest('th')) {
                document.querySelectorAll('.filter-dropdown').forEach(d => d.classList.remove('active'));
            }
        });

        function clearWorkspace() {
            allData = [];
            filteredData = [];
            baseHeaders = [];
            activeHeaders = [];
            columnFilters = {};
            hiddenColumns.clear();
            processedRows.clear();
            trackingMapA = {};
            trackingMapB = {};
            rowErrors = {};
            escrowLoaded = false;
            trackingLoaded = false;
            
            document.getElementById('tableHead').innerHTML = '';
            document.getElementById('tableBody').innerHTML = '';
            document.getElementById('globalSearch').value = '';
            document.getElementById('startSerial').value = '';
            document.getElementById('tabFilter').value = '';
            document.getElementById('typeFilter').value = '';
            document.getElementById('processFilter').value = '';
            document.getElementById('colorFilter').value = '';
            
            document.getElementById('recordCount').textContent = 'Showing 0 records';
            document.getElementById('countPayment').textContent = '0';
            document.getElementById('countRefund').textContent = '0';
            document.getElementById('sumTotal').textContent = '0';
            document.getElementById('sumPay').textContent = '0';
            document.getElementById('sumRef').textContent = '0';
            document.getElementById('sumTabs').innerHTML = '';
            
            document.getElementById('escrowContainer').className = "flex flex-col gap-0.5 p-1 bg-red-50 border border-red-200 rounded-lg transition-colors w-40";
            document.getElementById('escrowBtnText').textContent = 'Select File';
            document.getElementById('escrowBtnText').classList.remove('bg-blue-50', 'text-blue-700', 'border-blue-200');
            
            document.getElementById('trackingContainer').className = "flex flex-col gap-0.5 p-1 bg-red-50 border border-red-200 rounded-lg transition-colors w-40";
            document.getElementById('trackingBtnText').textContent = 'Select File';
            document.getElementById('trackingBtnText').classList.remove('bg-blue-50', 'text-blue-700', 'border-blue-200');
            
            document.getElementById('escrowFile').value = '';
            document.getElementById('trackingFile').value = '';
        }
    </script>
</body>
